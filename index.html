/* 불량 현황 탭: 실제 차종(RS4 / JG) 및 Door Name 기준으로 기간별·월별·불량유형별
   현황을 본다. 차종은 검사라인(line) 값으로 구분한다 — RS4는 그대로 "RS4",
   "JG 신검사"/"JG 재검사"는 모두 "JG"로 합쳐서 진짜 차종 단위(JG/RS4)로만 본다
   (사용자 확인: "차종분류는 진짜 차종 'JG 와 RS4' 두종류만"). Door Name은 별도
   필터 축으로 추가한다. */
var pdsAnalysisFilter = {year:'전체', startDate:'', endDate:'', carModel:'전체', doorName:'전체'};
var pdsChartUnit = 'month'; // 'month' | 'day'
var ALL_DEFECT_KEYS = ['defRattling','defRattling4','defRattling45','defRattling5','defDak45','defTokAuto','defSwinging','defSizzling','defScreaming','defBacklash','defHumming','defFunctionNok','defCreaking','defUnidentified','defEtc'];
var PDS_DEFECT_COLORS = {
  qtyCok:'#14b8a6', defRattling45:'#3b82f6', defRattling5:'#1e40af', defRattling:'#2563eb', defRattling35:'#1d4ed8', defRattling4:'#60a5fa', defDak45:'#0ea5e9', defTokAuto:'#a855f7', defSwinging:'#dc2626', defSizzling:'#f59e0b', defScreaming:'#10b981',
  defBacklash:'#8b5cf6', defHumming:'#ec4899', defFunctionNok:'#06b6d4', defCreaking:'#84cc16',
  defUnidentified:'#f97316', defEtc:'#6b7280'
};

/* 차종(JG / RS4 / RS4PE / RG3): 검사라인(시트)으로 구분하고, Door Name에 'RG3'가 들어가면 RG3로 본다. */
var PDS_CAR_MODELS = ['JG','RS4','RS4PE','RG3'];
function pdsCarModel(r){
  if(/RG3/i.test(String(r.doorName||''))) return 'RG3';
  var line = String(r.line||'');
  if(line.indexOf('RS4 PE')===0) return 'RS4PE';
  if(line==='RS4') return 'RS4';
  return 'JG';
}
function pdsDoorNames(){
  var set = {};
  state.inspectionLog.forEach(function(r){ if(r.doorName){ set[r.doorName]=true; } });
  return Object.keys(set).sort();
}
function pdsFilteredRows(ignoreCarModel, ignoreDoorName){
  var f = pdsAnalysisFilter;
  return state.inspectionLog.filter(function(r){
    if(!r.inspDate) return false;
    if(!ignoreCarModel && f.carModel!=='전체' && pdsCarModel(r)!==f.carModel) return false;
    if(!ignoreDoorName && f.doorName!=='전체' && r.doorName!==f.doorName) return false;
    if(f.startDate && r.inspDate < f.startDate) return false;
    if(f.endDate && r.inspDate > f.endDate) return false;
    if(!f.startDate && !f.endDate && f.year!=='전체' && r.inspDate.slice(0,4)!==String(f.year)) return false;
    return true;
  });
}
function pdsMonthlyAgg(rows){
  var byMonth = {};
  rows.forEach(function(r){
    var ym = (r.inspDate||'').slice(0,7);
    if(!ym) return;
    if(!byMonth[ym]) byMonth[ym] = {insp:0, ok:0, nok:0};
    byMonth[ym].insp += parseFloat(r.qtyInspected)||0;
    byMonth[ym].ok += parseFloat(r.qtyOk)||0;
    byMonth[ym].nok += parseFloat(r.qtyNok)||0;
  });
  return Object.keys(byMonth).sort().map(function(m){
    var b = byMonth[m];
    return {month:m, insp:b.insp, ok:b.ok, nok:b.nok, rate: b.insp ? (b.nok/b.insp*100) : 0};
  });
}
function pdsDailyAgg(rows){
  var byDay = {};
  rows.forEach(function(r){
    var d = r.inspDate; if(!d) return;
    if(!byDay[d]) byDay[d] = {insp:0, ok:0, nok:0};
    byDay[d].insp += parseFloat(r.qtyInspected)||0;
    byDay[d].ok += parseFloat(r.qtyOk)||0;
    byDay[d].nok += parseFloat(r.qtyNok)||0;
  });
  return Object.keys(byDay).sort().map(function(d){
    var b = byDay[d];
    return {month:d, insp:b.insp, ok:b.ok, nok:b.nok, rate: b.insp ? (b.nok/b.insp*100) : 0};
  });
}
function pdsDefectBreakdown(rows){
  var totals = {};
  var keys = ['qtyCok'].concat(ALL_DEFECT_KEYS);
  keys.forEach(function(k){ totals[k]=0; });
  rows.forEach(function(r){ keys.forEach(function(k){ totals[k] += parseFloat(r[k])||0; }); });
  return totals;
}

/* 월별 검사수량(막대) + 불량률(선)을 한 차트에 같이 보여주는 간단한 SVG 콤보 차트.
   외부 차트 라이브러리 없이(오프라인 배포 파일이므로) 순수 SVG로 그린다. */
function renderPdsComboChart(monthly, isDaily){
  var w = isDaily ? Math.max(760, monthly.length*24+92) : 760, h = 230, padL = 46, padR = 46, padT = 14, padB = isDaily ? 44 : 30;
  var innerW = w-padL-padR, innerH = h-padT-padB;
  var n = monthly.length;
  var maxInsp = Math.max.apply(null, monthly.map(function(d){ return d.insp; }).concat([1]));
  var maxRate = Math.max.apply(null, monthly.map(function(d){ return d.rate; }).concat([1]));
  var step = innerW/n;
  var bw = Math.max(6, Math.min(34, step*0.55));
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" width="'+(isDaily ? w : '100%')+'" height="'+h+'" preserveAspectRatio="xMidYMid meet" style="overflow:visible;">';
  // y-axis gridlines (검사수량 기준, 4단)
  for(var g=0; g<=4; g++){
    var gy = padT + innerH - (innerH*g/4);
    svg += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+innerW)+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1"></line>';
    svg += '<text x="'+(padL-8)+'" y="'+(gy+3)+'" font-size="9" text-anchor="end" fill="var(--muted)">'+Math.round(maxInsp*g/4).toLocaleString()+'</text>';
    svg += '<text x="'+(padL+innerW+8)+'" y="'+(gy+3)+'" font-size="9" text-anchor="start" fill="var(--critical,#dc2626)">'+(maxRate*g/4).toFixed(0)+'%</text>';
  }
  // bars (검사수량)
  monthly.forEach(function(d, i){
    var x = padL + step*i + (step-bw)/2;
    var barH = maxInsp ? (d.insp/maxInsp*innerH) : 0;
    var y = padT + innerH - barH;
    svg += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+barH+'" fill="var(--accent)" opacity="0.78" rx="2"><title>'+d.month+' · 검사 '+d.insp.toLocaleString()+' · NOK '+d.nok.toLocaleString()+' · '+d.rate.toFixed(1)+'%</title></rect>';
    if(isDaily && d.insp>0){ svg += '<text x="'+(x+bw/2)+'" y="'+(y-3)+'" font-size="8.5" text-anchor="middle" fill="var(--text,#334155)">'+Math.round(d.insp).toLocaleString()+'</text>'; }
  });
  // line (불량률 %, 별도 축 스케일)
  var pts = monthly.map(function(d, i){
    var x = padL + step*i + step/2;
    var y = padT + innerH - (maxRate ? (d.rate/maxRate*innerH) : 0);
    return x+','+y;
  }).join(' ');
  svg += '<polyline points="'+pts+'" fill="none" stroke="var(--critical,#dc2626)" stroke-width="2"></polyline>';
  monthly.forEach(function(d, i){
    var x = padL + step*i + step/2;
    var y = padT + innerH - (maxRate ? (d.rate/maxRate*innerH) : 0);
    svg += '<circle cx="'+x+'" cy="'+y+'" r="3" fill="var(--critical,#dc2626)"><title>'+d.month+' · '+d.rate.toFixed(1)+'%</title></circle>';
  });
  // x labels
  monthly.forEach(function(d, i){
    var x = padL + step*i + step/2;
    if(isDaily){
      svg += '<text transform="translate('+x+','+(h-34)+') rotate(60)" font-size="9" text-anchor="start" fill="var(--muted)">'+d.month.slice(5)+'</text>';
    } else {
      svg += '<text x="'+x+'" y="'+(h-6)+'" font-size="9.5" text-anchor="middle" fill="var(--muted)">'+d.month+'</text>';
    }
  });
  svg += '</svg>';
  return svg;
}

/* 불량유형별 비율 원형 차트 (SVG path 수동 계산, 외부 라이브러리 없음) */
var PDS_PIE_STANDARD = ['qtyCok','defRattling4','defRattling45','defRattling5','defDak45','defTokAuto'];
function renderPdsPieChart(totals){
  // 엑셀의 불량 유형 6종은 값이 0이어도 항상 범례에 표시하고, 그 외 유형(RS4 등)은 값이 있을 때만 추가한다.
  var shown = PDS_PIE_STANDARD.concat(ALL_DEFECT_KEYS.filter(function(k){ return PDS_PIE_STANDARD.indexOf(k)<0 && totals[k]>0; }));
  var entries = shown.map(function(k){ return {key:k, label:PDS_DEFECT_LABELS[k], val:totals[k]||0}; });
  var sum = entries.reduce(function(a,e){ return a+e.val; }, 0);
  if(!sum){ return '<p class="panel-sub" style="margin:0;">표시할 불량 데이터가 없습니다.</p>'; }
  var cx=100, cy=100, r=92;
  var startAngle = -90;
  var svg = '<svg viewBox="0 0 200 200" width="200" height="200" style="flex-shrink:0;">';
  entries.forEach(function(e){
    if(!e.val) return;
    var pct = e.val/sum;
    var angle = pct*360;
    var endAngle = startAngle+angle;
    var large = angle>180 ? 1 : 0;
    if(pct>=0.9995){
      svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+PDS_DEFECT_COLORS[e.key]+'"></circle>';
    } else {
      var x1 = cx + r*Math.cos(startAngle*Math.PI/180), y1 = cy + r*Math.sin(startAngle*Math.PI/180);
      var x2 = cx + r*Math.cos(endAngle*Math.PI/180), y2 = cy + r*Math.sin(endAngle*Math.PI/180);
      svg += '<path d="M'+cx+','+cy+' L'+x1.toFixed(2)+','+y1.toFixed(2)+' A'+r+','+r+' 0 '+large+' 1 '+x2.toFixed(2)+','+y2.toFixed(2)+' Z" fill="'+PDS_DEFECT_COLORS[e.key]+'"></path>';
    }
    startAngle = endAngle;
  });
  svg += '</svg>';
  var legendRows = entries.slice().sort(function(a,b){ return b.val-a.val; }).map(function(e){
    var pct = (e.val/sum*100).toFixed(1);
    return '<div style="display:flex;align-items:center;gap:7px;"><span style="width:10px;height:10px;border-radius:3px;background:'+PDS_DEFECT_COLORS[e.key]+';flex-shrink:0;"></span><span style="flex:1;">'+e.label+'</span><span class="cell-strong">'+pct+'%</span><span class="cell-muted">('+e.val.toLocaleString()+'건)</span></div>';
  }).join('');
  return svg+'<div style="display:flex;flex-direction:column;gap:7px;font-size:12.5px;min-width:200px;">'+legendRows+'</div>';
}

function renderPdsStatus(){
  var f = pdsAnalysisFilter;
  var doorNames = pdsDoorNames();
  var rows = pdsFilteredRows();

  var html = '';
  html += '<div class="toolbar" style="margin-bottom:16px;flex-wrap:wrap;">';
  html += '<div><label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px;">연도</label><select class="filter" data-pds-filter="year">';
  html += '<option value="전체"'+(f.year==='전체'?' selected':'')+'>전체 연도</option>';
  for(var y=2023; y<=2032; y++){ html += '<option value="'+y+'"'+(String(f.year)===String(y)?' selected':'')+'>'+y+'년</option>'; }
  html += '</select></div>';
  html += '<div><label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px;">시작일</label><input type="date" class="filter" data-pds-filter="start" value="'+escAttr(f.startDate)+'"></div>';
  html += '<div><label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px;">종료일</label><input type="date" class="filter" data-pds-filter="end" value="'+escAttr(f.endDate)+'"></div>';
  html += '<div><label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px;">차종</label><select class="filter" data-pds-filter="carModel">';
  html += '<option value="전체"'+(f.carModel==='전체'?' selected':'')+'>전체 차종 통합</option>';
  PDS_CAR_MODELS.forEach(function(cm){ html += '<option value="'+cm+'"'+(f.carModel===cm?' selected':'')+'>'+cm+'</option>'; });
  html += '</select></div>';
  html += '<div><label style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px;">Door Name</label><select class="filter" data-pds-filter="doorName">';
  html += '<option value="전체"'+(f.doorName==='전체'?' selected':'')+'>전체 Door</option>';
  doorNames.forEach(function(d){ html += '<option value="'+escAttr(d)+'"'+(f.doorName===d?' selected':'')+'>'+escAttr(d)+'</option>'; });
  html += '</select></div>';
  html += '<div class="spacer"></div>';
  if(f.startDate || f.endDate || f.year!=='전체' || f.carModel!=='전체' || f.doorName!=='전체'){
    html += '<div style="align-self:flex-end;"><button type="button" class="btn sm" data-pds-filter-reset="1">필터 초기화</button></div>';
  }
  html += '</div>';

  var tot = {insp:0, ok:0, cok:0, nok:0};
  rows.forEach(function(r){ tot.insp+=parseFloat(r.qtyInspected)||0; tot.ok+=parseFloat(r.qtyOk)||0; tot.cok+=parseFloat(r.qtyCok)||0; tot.nok+=parseFloat(r.qtyNok)||0; });
  var totRate = tot.insp ? (tot.nok/tot.insp*100).toFixed(2) : '0.00';
  html += '<div class="pds-stat-cards">';
  html += '<div class="pds-stat-card"><div class="lbl">검사수량</div><div class="val">'+tot.insp.toLocaleString()+'</div></div>';
  html += '<div class="pds-stat-card"><div class="lbl">OK수량</div><div class="val">'+tot.ok.toLocaleString()+'</div></div>';
  html += '<div class="pds-stat-card"><div class="lbl">3.5 (COK)</div><div class="val">'+tot.cok.toLocaleString()+'</div></div>';
  html += '<div class="pds-stat-card"><div class="lbl">NOK수량</div><div class="val">'+tot.nok.toLocaleString()+'</div></div>';
  html += '<div class="pds-stat-card"><div class="lbl">불량률</div><div class="val">'+totRate+'%</div></div>';
  html += '</div>';

  var scopeLabel = (f.carModel==='전체' ? '전체 차종 통합' : f.carModel) + (f.doorName!=='전체' ? ' · '+f.doorName : '');
  var isDaily = pdsChartUnit==='day';
  var monthly = isDaily ? pdsDailyAgg(rows) : pdsMonthlyAgg(rows);
  html += '<div class="pds-chart-wrap"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px;"><h3 style="margin:0;font-size:14px;">'+(isDaily?'일별':'월별')+' 검사수량 및 불량률 · '+escHtml(scopeLabel)+'</h3>';
  html += '<span class="seg" style="display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;">';
  html += '<button type="button" class="btn sm" data-pds-unit="month" style="border:0;border-radius:0;'+(!isDaily?'background:var(--accent);color:#fff;':'')+'">월별</button>';
  html += '<button type="button" class="btn sm" data-pds-unit="day" style="border:0;border-radius:0;'+(isDaily?'background:var(--accent);color:#fff;':'')+'">일별</button></span></div>';
  html += '<div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:6px;"><span><span style="display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:2px;margin-right:4px;"></span>검사수량(막대, 좌측 축)</span><span><span style="display:inline-block;width:9px;height:9px;background:var(--critical,#dc2626);border-radius:50%;margin-right:4px;"></span>불량률%(선, 우측 축)</span></div>';
  html += monthly.length ? (isDaily ? '<div style="overflow-x:auto;padding-bottom:6px;">'+renderPdsComboChart(monthly, true)+'</div>' : renderPdsComboChart(monthly, false)) : '<p class="panel-sub" style="margin:0;">표시할 데이터가 없습니다.</p>';
  html += '</div>';

  var defectTotals = pdsDefectBreakdown(rows);
  var noType = 0;
  rows.forEach(function(r){
    if((parseFloat(r.qtyNok)||0)>0){
      var any = false;
      ALL_DEFECT_KEYS.forEach(function(k){ if(parseFloat(r[k])>0) any = true; });
      if(!any) noType++;
    }
  });
  html += '<div class="pds-chart-wrap"><h3 style="margin:0 0 12px;font-size:14px;">불량유형별 비율 · '+escHtml(scopeLabel)+'</h3>';
  if(noType>0){
    html += '<div style="margin-bottom:12px;padding:10px 12px;border:1px solid #f59e0b;border-radius:10px;background:rgba(245,158,11,.1);font-size:12.5px;"><b>불량 유형 값이 비어 있는 NOK 행 '+noType+'건</b>이 있습니다. 예전 방식으로 가져온 데이터일 수 있습니다. 검사일지(PDS) 화면의 <b>엑셀로 전체 교체</b>로 최신 원본 파일을 다시 가져오면 유형별 값이 채워집니다.</div>';
  }
  html += '<div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap;">'+renderPdsPieChart(defectTotals)+'</div>';
  html += '<p class="panel-sub" style="margin:10px 0 0;font-size:11.5px;">※ 3.5 Rattling (COK)는 조건부 OK로, 상단 NOK수량·불량률에는 포함되지 않습니다.</p>';
  html += '</div>';

  var byModel = {};
  pdsFilteredRows(true, true).forEach(function(r){
    var c = pdsCarModel(r);
    if(!byModel[c]) byModel[c] = {insp:0, ok:0, nok:0};
    byModel[c].insp += parseFloat(r.qtyInspected)||0;
    byModel[c].ok += parseFloat(r.qtyOk)||0;
    byModel[c].nok += parseFloat(r.qtyNok)||0;
  });
  var modelKeys = PDS_CAR_MODELS.filter(function(c){ return byModel[c]; });
  html += '<div class="table-wrap"><div class="table-scroll"><table><thead><tr><th>차종</th><th>검사수량</th><th>OK</th><th>NOK</th><th>불량률</th></tr></thead><tbody>';
  if(!modelKeys.length){ html += '<tr class="empty-row"><td colspan="5">데이터가 없습니다.</td></tr>'; }
  modelKeys.forEach(function(c){
    var b = byModel[c];
    var rate = b.insp ? (b.nok/b.insp*100).toFixed(2) : '0.00';
    var hi = f.carModel===c ? ' style="background:var(--surface-2);"' : '';
    html += '<tr'+hi+'><td class="cell-strong">'+escHtml(c)+'</td><td>'+b.insp.toLocaleString()+'</td><td>'+b.ok.toLocaleString()+'</td><td>'+b.nok.toLocaleString()+'</td><td>'+rate+'%</td></tr>';
  });
  html += '</tbody></table></div></div>';

  /* 집계 근거: 지금 화면 숫자가 어떤 검사라인(시트) 데이터로 구성되어 있는지, 내용이 똑같은 중복 행은 없는지 확인 */
  var byLine = {}, fpCount = {}, dupRows = 0, dupQty = 0;
  rows.forEach(function(r){
    var ln = r.line || '(검사라인 미지정)';
    if(!byLine[ln]) byLine[ln] = {n:0, insp:0, ok:0, cok:0, nok:0};
    byLine[ln].n++;
    byLine[ln].cok += parseFloat(r.qtyCok)||0;
    byLine[ln].insp += parseFloat(r.qtyInspected)||0;
    byLine[ln].ok += parseFloat(r.qtyOk)||0;
    byLine[ln].nok += parseFloat(r.qtyNok)||0;
    var fpk = [r.line,r.inspDate,r.workerName,r.category,r.doorName,r.lotNo,r.qtyInspected,r.qtyOk].join('|');
    fpCount[fpk] = (fpCount[fpk]||0)+1;
    if(fpCount[fpk]>1){ dupQty += parseFloat(r.qtyInspected)||0; }
  });
  Object.keys(fpCount).forEach(function(k){ if(fpCount[k]>1) dupRows += fpCount[k]-1; });
  if(dupRows>0 && tot.insp>0 && dupQty/tot.insp>0.2){
    html += '<div class="callout warn" style="margin-bottom:14px;padding:12px 14px;border:1px solid var(--warn,#f59e0b);border-radius:10px;background:rgba(245,158,11,.1);font-size:13px;"><b>중복 데이터 의심:</b> 내용이 완전히 같은 행 '+dupRows+'건(검사수량 '+dupQty.toLocaleString()+')이 포함되어 있습니다. 엑셀을 여러 번 가져왔거나 예전 데이터가 남아 있을 수 있습니다. 검사일지(PDS) 화면의 <b>엑셀로 전체 교체</b>로 원본 파일을 다시 가져오면 정리됩니다.</div>';
  }
  html += '<div class="table-wrap" style="margin-bottom:14px;"><div class="table-scroll"><table><thead><tr><th>집계 근거 · 검사라인(시트)</th><th>행 수</th><th>검사수량</th><th>OK</th><th>3.5 (COK)</th><th>NOK</th></tr></thead><tbody>';
  var lineKeys = Object.keys(byLine);
  if(!lineKeys.length){ html += '<tr class="empty-row"><td colspan="6">데이터가 없습니다.</td></tr>'; }
  lineKeys.forEach(function(ln){
    var b = byLine[ln];
    html += '<tr><td class="cell-strong">'+escHtml(ln)+'</td><td>'+b.n.toLocaleString()+'</td><td>'+b.insp.toLocaleString()+'</td><td>'+b.ok.toLocaleString()+'</td><td>'+b.cok.toLocaleString()+'</td><td>'+b.nok.toLocaleString()+'</td></tr>';
  });
  html += '</tbody></table></div><div class="pager"><span>'+(dupRows ? '내용이 완전히 같은 행 <b>'+dupRows+'건</b> 포함 (중복 등록 가능성)' : '내용이 완전히 같은 중복 행 없음')+'</span><span class="mono">현재 필터 기준</span></div></div>';

  var byDoor = {};
  pdsFilteredRows(false, true).forEach(function(r){
    var d = r.doorName || '(미입력)';
    if(!byDoor[d]) byDoor[d] = {insp:0, ok:0, nok:0};
    byDoor[d].insp += parseFloat(r.qtyInspected)||0;
    byDoor[d].ok += parseFloat(r.qtyOk)||0;
    byDoor[d].nok += parseFloat(r.qtyNok)||0;
  });
  var doorKeys = Object.keys(byDoor).sort(function(a,b){ return byDoor[b].insp-byDoor[a].insp; });
  html += '<div class="table-wrap" style="margin-top:14px;"><div class="table-scroll"><table><thead><tr><th>Door Name</th><th>검사수량</th><th>OK</th><th>NOK</th><th>불량률</th></tr></thead><tbody>';
  if(!doorKeys.length){ html += '<tr class="empty-row"><td colspan="5">데이터가 없습니다.</td></tr>'; }
  doorKeys.forEach(function(d){
    var b = byDoor[d];
    var rate = b.insp ? (b.nok/b.insp*100).toFixed(2) : '0.00';
    var hi = f.doorName===d ? ' style="background:var(--surface-2);"' : '';
    html += '<tr'+hi+'><td class="cell-strong">'+escHtml(d)+'</td><td>'+b.insp.toLocaleString()+'</td><td>'+b.ok.toLocaleString()+'</td><td>'+b.nok.toLocaleString()+'</td><td>'+rate+'%</td></tr>';
  });
  html += '</tbody></table></div></div>';

  document.getElementById('pdsTabBody').innerHTML = html;
}

/* ---- PDS 엑셀 이력 가져오기 ----
   batch.commit()은 한 번에 500건 제한이 있고, 기존 persist()는 모든 모듈을
   하나의 batch에 함께 담기 때문에 수백~수천 건을 그 방식으로 넣으면 실패한다.
   그래서 가져오기 전용으로 대상 컬렉션만, 여러 배치로 나누어 순서대로 저장한다. */
function xlsxDateToISO(v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v === 'number'){
    var utcDays = Math.floor(v - 25569);
    var d0 = new Date(utcDays*86400*1000);
    var y0=d0.getUTCFullYear(), m0=('0'+(d0.getUTCMonth()+1)).slice(-2), d1=('0'+d0.getUTCDate()).slice(-2);
    return y0+'-'+m0+'-'+d1;
  }
  if(v instanceof Date){
    var y=v.getUTCFullYear(), m=('0'+(v.getUTCMonth()+1)).slice(-2), d=('0'+v.getUTCDate()).slice(-2);
    return y+'-'+m+'-'+d;
  }
  var str = String(v).trim();
  var m2 = str.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m2){ return m2[1]+'-'+('0'+m2[2]).slice(-2)+'-'+('0'+m2[3]).slice(-2); }
  return '';
}
function pdsNum(v){
  if(typeof v==='number'){ return isFinite(v) ? v : 0; }
  // '566ut' 같은 오타 문자열을 숫자로 오인하지 않도록, 숫자만 있는 문자열만 인정
  var t = String(v===null||v===undefined?'':v).replace(/,/g,'').trim();
  if(!/^-?\d+(\.\d+)?$/.test(t)) return 0;
  return parseFloat(t);
}
function pdsStr(v){ return (v===null||v===undefined) ? '' : String(v).trim(); }

function parseRs4Row(row){
  var date = xlsxDateToISO(row[1]), worker = pdsStr(row[2]);
  if(!date && !worker) return null;
  return {
    line:'RS4', inspDate:date, workerName:worker, category:pdsStr(row[3]), doorName:pdsStr(row[4]), lotNo:pdsStr(row[5]),
    qtyInspected:pdsNum(row[6]), qtyOk:pdsNum(row[7]), qtyNok:pdsNum(row[9]),
    defRattling:pdsNum(row[10]), defSwinging:pdsNum(row[11]), defSizzling:pdsNum(row[12]), defScreaming:pdsNum(row[13]),
    defBacklash:pdsNum(row[14]), defHumming:pdsNum(row[15]), defFunctionNok:pdsNum(row[16]), defCreaking:pdsNum(row[17]), defEtc:pdsNum(row[18]),
    note:''
  };
}
function parseJgDailyRow(row){
  var date = xlsxDateToISO(row[1]), worker = pdsStr(row[2]);
  if(!date && !worker) return null;
  return {
    line:'JG 신검사', inspDate:date, workerName:worker, category:pdsStr(row[3]), doorName:pdsStr(row[4]), lotNo:pdsStr(row[5]),
    qtyInspected:pdsNum(row[6]), qtyOk:pdsNum(row[7]), qtyNok:pdsNum(row[8]),
    defRattling35:pdsNum(row[9]), defRattling4:pdsNum(row[10]), defBacklash:pdsNum(row[11]), defUnidentified:pdsNum(row[13]),
    note:''
  };
}
function parseJgReRow(row){
  var date = xlsxDateToISO(row[1]), worker = pdsStr(row[2]);
  if(!date && !worker) return null;
  return {
    line:'JG 재검사', inspDate:date, workerName:worker, category:pdsStr(row[3]), doorName:pdsStr(row[4]), lotNo:pdsStr(row[5]),
    qtyInspected:pdsNum(row[6]), qtyOk:pdsNum(row[7]), qtyNok:pdsNum(row[8]),
    defRattling35:pdsNum(row[9]), defRattling4:pdsNum(row[10]), defBacklash:pdsNum(row[11]),
    note:''
  };
}
function parseDeliveryRow(row){
  var date = xlsxDateToISO(row[0]), doorNum = pdsStr(row[1]);
  if(!date && !doorNum) return null;
  return { date:date, doorNum:doorNum, doorName:pdsStr(row[2]), qty:pdsNum(row[3]), note:pdsStr(row[4]) };
}

/* RS4 PE 시트는 컬럼 순서를 알 수 없어서(기존 RS4/JG 시트와 같은 양식을 가정), 헤더 이름으로 컬럼을 찾아 읽는다. */
function pdsHeaderMap(headerRow){
  var map = {};
  (headerRow||[]).forEach(function(h, idx){
    var t = String(h===null||h===undefined?'':h).replace(/\s+/g,' ').trim().toLowerCase();
    if(!t) return;
    var key = null;
    if(/불량 ?유형/.test(t)) key=null;
    else if(/inspection ?date|검사일/.test(t)) key='inspDate';
    else if(/작업자/.test(t)) key='workerName';
    else if(/^분류/.test(t)) key='category';
    else if(/door ?name/.test(t)) key='doorName';
    else if(/^lot/.test(t)) key='lotNo';
    else if(/inspected/.test(t)) key='qtyInspected';
    else if(/^ok/.test(t)) key='qtyOk';
    else if(/^nok/.test(t)) key='qtyNok';
    else if(/\+/.test(t) || /불량률|total/.test(t)) key=null;
    else if(/^3\.5/.test(t)) key='qtyCok';
    else if(/^4\.5 ?rattling/.test(t)) key='defRattling45';
    else if(/^5 ?rattling/.test(t)) key='defRattling5';
    else if(/^4\.5/.test(t)) key='defDak45';
    else if(/^tok/.test(t)) key='defTokAuto';
    else if(/^4 ?rattling/.test(t)) key='defRattling4';
    else if(/^rattling/.test(t)) key='defRattling';
    else if(/swinging/.test(t)) key='defSwinging';
    else if(/sizzling/.test(t)) key='defSizzling';
    else if(/screaming/.test(t)) key='defScreaming';
    else if(/backlash/.test(t)) key='defBacklash';
    else if(/humming/.test(t)) key='defHumming';
    else if(/function/.test(t)) key='defFunctionNok';
    else if(/creaking/.test(t)) key='defCreaking';
    else if(/식별/.test(t)) key='defUnidentified';
    else if(/^기타|^etc/.test(t)) key='defEtc';
    if(key && map[key]===undefined) map[key] = idx;
  });
  return map;
}
function parseByHeaderRow(row, map, line){
  var date = xlsxDateToISO(row[map.inspDate]), worker = map.workerName!==undefined ? pdsStr(row[map.workerName]) : '';
  if(!date && !worker) return null;
  var rec = {line:line, inspDate:date, workerName:worker,
    category: map.category!==undefined ? pdsStr(row[map.category]) : '',
    doorName: map.doorName!==undefined ? pdsStr(row[map.doorName]) : '',
    lotNo: map.lotNo!==undefined ? pdsStr(row[map.lotNo]) : '',
    qtyInspected: pdsNum(row[map.qtyInspected]), qtyOk: pdsNum(row[map.qtyOk]), qtyNok: pdsNum(row[map.qtyNok]),
    qtyCok: map.qtyCok!==undefined ? pdsNum(row[map.qtyCok]) : 0, note:''};
  ALL_DEFECT_KEYS.forEach(function(k){
    if(map[k]!==undefined){ var v = pdsNum(row[map[k]]); if(v) rec[k] = v; }
  });
  // NOK가 비어 있으면 검사수량-OK로 보정
  // NOK = 3.5(COK)·Inspected·OK를 제외한 모든 불량 항목(4 Rattling, 4.5 Dak, TOK 등)의 합. 항목 값이 없으면 엑셀 NOK Qty 열 사용.
  var dsum = 0;
  ALL_DEFECT_KEYS.forEach(function(k){ dsum += rec[k]||0; });
  if(dsum>0){ rec.qtyNok = dsum; }
  else if(!rec.qtyNok && rec.qtyInspected && rec.qtyOk && rec.qtyInspected>rec.qtyOk+rec.qtyCok){ rec.qtyNok = rec.qtyInspected-rec.qtyOk-rec.qtyCok; }
  return rec;
}
function pdsNormSheetName(n){ return String(n||'').replace(/\s+/g,'').toLowerCase(); }

var PDS_IMPORT_SHEETS = [
  {name:'RS4 Daily PDS입력란', match:function(n){ n=pdsNormSheetName(n); return n.indexOf('rs4')>-1 && n.indexOf('rs4pe')===-1 && n.indexOf('재검사')===-1; }, headerLine:'RS4', target:'inspectionLog', dateKey:'inspDate', idPrefix:'PD'},
  {name:'JG Daily PDS입력란', match:function(n){ n=pdsNormSheetName(n); return n.indexOf('jg')>-1 && n.indexOf('재검사')===-1; }, headerLine:'JG 신검사', target:'inspectionLog', dateKey:'inspDate', idPrefix:'PD'},
  {name:'JG 재검사 PDS입력란', match:function(n){ n=pdsNormSheetName(n); return n.indexOf('jg')>-1 && n.indexOf('재검사')>-1; }, headerLine:'JG 재검사', target:'inspectionLog', dateKey:'inspDate', idPrefix:'PD'},
  {name:'RS4 PE Daily PDS입력란', match:function(n){ n=pdsNormSheetName(n); return n.indexOf('rs4pe')>-1 && n.indexOf('재검사')===-1; }, headerLine:'RS4 PE', target:'inspectionLog', dateKey:'inspDate', idPrefix:'PD'},
  {name:'RS4 PE 재검사 PDS입력란', match:function(n){ n=pdsNormSheetName(n); return n.indexOf('rs4pe')>-1 && n.indexOf('재검사')>-1; }, headerLine:'RS4 PE 재검사', target:'inspectionLog', dateKey:'inspDate', idPrefix:'PD'},
  {name:'입고품', target:'pdsIncoming', dateKey:'date', parse:parseDeliveryRow, idPrefix:'PDIN'},
  {name:'출하', target:'pdsShipment', dateKey:'date', parse:parseDeliveryRow, idPrefix:'PDSH'},
  {name:'Shipback', target:'pdsShipback', dateKey:'date', parse:parseDeliveryRow, idPrefix:'PDSB'}
];

function bulkPersistNewRecords(target, records, onProgress){
  var CHUNK = 400;
  var chunks = [];
  for(var i=0;i<records.length;i+=CHUNK){ chunks.push(records.slice(i,i+CHUNK)); }
  var p = Promise.resolve();
  var done = 0;
  chunks.forEach(function(chunk){
    p = p.then(function(){
      var batch = fbDb.batch();
      chunk.forEach(function(r){
        var payload = Object.assign({}, r, {
          _updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          _updatedBy: (currentUser && currentUser.email) || ''
        });
        batch.set(fbDb.collection(target).doc(r.id), payload);
      });
      return withSaveTimeout(batch.commit().then(function(){ return fbDb.waitForPendingWrites(); }));
    }).then(function(){
      done += chunk.length;
      if(onProgress){ onProgress(done, records.length); }
    });
  });
  return p;
}

function bulkDeleteRecords(target, ids, onProgress){
  var CHUNK = 400, p = Promise.resolve(), done = 0;
  for(var i=0;i<ids.length;i+=CHUNK){
    (function(chunk){
      p = p.then(function(){
        var batch = fbDb.batch();
        chunk.forEach(function(id){ batch.delete(fbDb.collection(target).doc(id)); });
        return withSaveTimeout(batch.commit().then(function(){ return fbDb.waitForPendingWrites(); }));
      }).then(function(){ done += chunk.length; if(onProgress){ onProgress(done, ids.length); } });
    })(ids.slice(i,i+CHUNK));
  }
  return p;
}

function importPdsWorkbook(file, replaceMode){
  if(isGuest){ showToast('게스트 계정은 조회만 가능합니다. 수정하려면 품질팀 계정으로 로그인해주세요.'); return; }
  if(typeof XLSX === 'undefined'){ showToast('엑셀 처리 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.'); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array'});
      var cutoffYear = 2025; // 2025년 이후 데이터만 가져옴 (그 이전 과거 이력은 제외) -- 사용자 요청: "25년도 data부터 입력"
      var cutoff = cutoffYear+'-01-01';
      var byTarget = {}; // target -> parsed records
      var sheetsFound = 0, skippedOld = 0;
      // 이미 등록된 행은 다시 가져오지 않도록(중복 방지) 내용 기준 지문을 만든다.
      function fp(target, r){
        if(target==='inspectionLog'){ return ['L',r.line,r.inspDate,r.workerName,r.category,r.doorName,r.lotNo,r.qtyInspected,r.qtyOk].join('|'); }
        return ['D',r.date,r.doorNum,r.doorName,r.qty,r.note].join('|');
      }
      var seen = {};
      (replaceMode ? [] : ['inspectionLog','pdsIncoming','pdsShipment','pdsShipback']).forEach(function(t){
        (state[t]||[]).forEach(function(r){ var kk = t+'#'+fp(t,r); seen[kk] = (seen[kk]||0)+1; });
      });
      var skippedDup = 0;
      var usedSheets = {};
      PDS_IMPORT_SHEETS.forEach(function(sc){
        var sheetName = null;
        if(sc.match){
          wb.SheetNames.forEach(function(n){ if(!sheetName && !usedSheets[n] && sc.match(n)){ sheetName = n; } });
        } else if(wb.Sheets[sc.name]){ sheetName = sc.name; }
        if(!sheetName) return;
        usedSheets[sheetName] = true;
        var sheet = wb.Sheets[sheetName];
        sheetsFound++;
        var matrix = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null});
        if(!byTarget[sc.target]) byTarget[sc.target] = [];
        var startRow = 2, hmap = null;
        if(sc.headerLine){
          for(var hi=0; hi<Math.min(8, matrix.length); hi++){
            var cand = pdsHeaderMap(matrix[hi]);
            if(cand.inspDate!==undefined && cand.qtyInspected!==undefined){ hmap = cand; startRow = hi+1; break; }
          }
          if(!hmap){ return; }
        }
        for(var i=startRow; i<matrix.length; i++){
          var row = matrix[i];
          if(!row) continue;
          var parsed = sc.headerLine ? parseByHeaderRow(row, hmap, sc.headerLine) : sc.parse(row);
          if(!parsed) continue;
          if(!parsed[sc.dateKey]){ continue; } // 날짜 없는 행(합계·메모 등)은 제외
          if(parsed[sc.dateKey] < cutoff){ skippedOld++; continue; }
          var k = sc.target+'#'+fp(sc.target, parsed);
          if(seen[k]>0){ seen[k]--; skippedDup++; continue; }
          parsed.id = uid(sc.idPrefix);
          byTarget[sc.target].push(parsed);
        }
      });
      if(sheetsFound===0){ showToast('PDS 시트를 찾을 수 없습니다. 파일을 확인해주세요.'); return; }
      var total = 0;
      Object.keys(byTarget).forEach(function(k){ total += byTarget[k].length; });
      if(total===0){ showToast('새로 가져올 데이터가 없습니다 ('+cutoffYear+'년 이후 데이터만 가져오며, 이미 등록된 행 '+skippedDup+'건은 제외됩니다).'); return; }
      var summary = Object.keys(byTarget).map(function(k){ return (MODULES[k]?MODULES[k].label:k)+' '+byTarget[k].length+'건'; }).join(', ');
      var confirmMsg;
      if(replaceMode){
        var delSummary = Object.keys(byTarget).map(function(k){ return (MODULES[k]?MODULES[k].label:k)+' '+(state[k]||[]).length+'건'; }).join(', ');
        confirmMsg = '현재 저장된 데이터('+delSummary+')를 모두 삭제하고, 엑셀의 '+cutoffYear+'년 이후 데이터 '+total+'건('+summary+')으로 교체합니다. '+
          '화면에서 직접 입력한 행도 함께 삭제되며 되돌릴 수 없습니다. 계속할까요?';
      } else {
        confirmMsg = cutoffYear+'년 이후 데이터 '+total+'건을 가져옵니다 ('+summary+'). '+
          '그 이전 과거 이력('+skippedOld+'건)과 이미 등록된 행('+skippedDup+'건)은 제외됩니다. 계속할까요?';
      }
      showConfirm(
        confirmMsg,
        function(){
          showToast('가져오는 중입니다... (0/'+total+')');
          var targets = Object.keys(byTarget);
          var chain = Promise.resolve();
          targets.forEach(function(k){
            if(replaceMode){
              chain = chain.then(function(){
                var ids = (state[k]||[]).map(function(r){ return r.id; });
                return bulkDeleteRecords(k, ids, function(done, n){ showToast('기존 데이터 삭제 중입니다... ('+done+'/'+n+')'); });
              }).then(function(){ state[k] = []; });
            }
            chain = chain.then(function(){
              return bulkPersistNewRecords(k, byTarget[k], function(done, n){
                showToast('가져오는 중입니다... ('+done+'/'+n+')');
              });
            }).then(function(){
              // 실시간 동기화(onSnapshot)가 이미 새 행을 state에 넣었을 수 있으므로 id 기준으로 병합 (중복 방지)
              var have = {}; (state[k]||[]).forEach(function(r){ have[r.id] = true; });
              byTarget[k].forEach(function(r){ if(!have[r.id]){ state[k].push(r); } });
            });
          });
          chain.then(function(){
            renderMenu();
            renderPdsTabBody();
            showToast('엑셀 업로드 완료: 총 '+total+'건 등록되었습니다.');
          }).catch(function(err){
            console.error(err);
            showToast('가져오는 중 오류가 발생했습니다: '+((err&&err.message)||''));
          });
        }
      );
    }catch(err){
      console.error(err);
      showToast('엑셀 파일을 읽는 중 오류가 발생했습니다.');
    }
  };
  reader.onerror = function(){ showToast('파일을 읽는 중 오류가 발생했습니다.'); };
  reader.readAsArrayBuffer(file);
}

var listUIState = {}; // per module: {q, status}
/* Clicking a dashboard KPI card, status row, or upcoming-schedule row jumps
   straight to the matching module's list, pre-filtered where that makes
   sense (a specific status/extra value, or the one record's id so only that
   row shows) instead of just landing on the module's unfiltered list. */
function dashNavigate(route, opts){
  opts = opts || {};
  if(!MODULES[route] && route!=='suppliers') return;
  if(!listUIState[route]) listUIState[route] = {q:'', status:'전체', year:'전체', extra:'전체'};
  listUIState[route].status = opts.status || '전체';
  listUIState[route].extra = opts.extra || '전체';
  listUIState[route].year = '전체';
  listUIState[route].from = '';
  listUIState[route].to = '';
  listUIState[route].q = opts.q || '';
  if(route==='suppliers'){ supplierActiveTab = 'audit'; }
  go(route);
}
function mailFieldName(mail, kind){
  if(kind==='date') return mail.dateField || 'dueDate';
  if(kind==='name') return mail.nameField || 'ownerName';
  return mail.emailField || 'ownerEmail';
}
function renderOverdueBanner(modKey, rows){
  var m = MODULES[modKey];
  var mail = m.mail;
  if(!mail) return '';
  var dateKey = mailFieldName(mail,'date'), nameKey = mailFieldName(mail,'name'), emailKey = mailFieldName(mail,'email');
  var overdue = rows.filter(mail.overdueCheck);
  var dueSoon = mail.dueSoonCheck ? rows.filter(mail.dueSoonCheck) : [];
  if(!overdue.length && !dueSoon.length) return '';
  function rowHtml(r, isOverdue){
    var n = Math.abs(daysUntil(r[dateKey]));
    var subjectFn = isOverdue ? mail.overdueSubject : mail.dueSoonSubject;
    var bodyFn = isOverdue ? mail.overdueBody : mail.dueSoonBody;
    var subject = encodeURIComponent(subjectFn(r,n));
    var body = encodeURIComponent(withMailFooter(bodyFn(r,n)));
    var mailHref = r[emailKey] ? ('mailto:'+r[emailKey]+'?subject='+subject+'&body='+body) : null;
    var label = r.part || r.name || r.equipNo || r.partName || r.title || '-';
    var html = '<div class="overdue-row">';
    html += '<span class="mono cell-strong">'+(r.id||'-')+'</span>';
    html += '<span>'+label+'</span>';
    html += '<span>'+(r[nameKey]||'담당자 미지정')+(r[emailKey]?' · '+r[emailKey]:'')+'</span>';
    html += '<span class="dday '+(isOverdue?'close':'near')+'">'+(isOverdue?('D+'+n):('D-'+n))+'</span>';
    html += mailHref ? '<a class="btn sm primary" href="'+mailHref+'">메일 발송</a>' : '<span class="cell-muted" style="font-size:11.5px;">이메일 미등록</span>';
    html += '</div>';
    return html;
  }
  var html = '<div class="overdue-banner">';
  if(overdue.length){
    html += '<div class="overdue-head">'+ICONS.defect+'<div><b>'+mail.overdueLabel+' 초과 '+overdue.length+'건</b>';
    html += '<div class="sub">담당자 이메일이 등록된 건은 아래 버튼으로 알림 메일 초안을 바로 열 수 있습니다. 이 앱은 자동으로 메일을 발송하지 않으며, 버튼을 누르면 담당자의 메일 클라이언트가 열립니다.</div></div></div>';
    html += '<div class="overdue-list">'+overdue.map(function(r){return rowHtml(r,true);}).join('')+'</div>';
  }
  if(dueSoon.length){
    html += '<div class="overdue-head"'+(overdue.length?' style="margin-top:14px;"':'')+'>'+ICONS.info+'<div><b>'+mail.overdueLabel+' 임박(7일 이내) '+dueSoon.length+'건</b>';
    html += '<div class="sub">기한이 곧 도래하는 건입니다. 아래 버튼으로 확인 메일 초안을 열 수 있습니다.</div></div></div>';
    html += '<div class="overdue-list">'+dueSoon.map(function(r){return rowHtml(r,false);}).join('')+'</div>';
  }
  html += '</div>';
  return html;
}

/* 발생구분 표기 흔들림(공백·대소문자·'3MIS' 등)을 0km / 3M / 일반 세 가지로 통일 */
function occCategory(v){
  var s = String(v==null?'':v).toLowerCase().replace(/\s+/g,'');
  if(/^0?km$|^0km|^0\.?km|^제로/.test(s) || s==='0') return '0km';
  if(/^3m|^3개월|^삼엠/.test(s)) return '3M';
  return '일반';
}
function normDateStr(d){
  var s = String(d==null?'':d).trim().replace(/[./]/g,'-');
  var m = s.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/);
  return m ? m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+(m[3]||'1')).slice(-2) : '';
}

function filteredRowsFor(modKey){
  var m = MODULES[modKey];
  var ui = listUIState[modKey] || {q:'', status:'전체', year:'전체', extra:'전체'};
  var rows = state[modKey];
  return rows.filter(function(r){
    var matchQ = !ui.q || m.searchKeys.some(function(k){ return (r[k]||'').toString().toLowerCase().indexOf(ui.q.toLowerCase())>-1; });
    var matchS = ui.status==='전체' || r[m.statusField]===ui.status;
    var matchY = true;
    if(m.yearFilterField && ui.year && ui.year!=='전체'){
      var dv = r[m.yearFilterField];
      matchY = !!dv && String(dv).slice(0,4)===String(ui.year);
    }
    var matchE = true;
    if(m.extraFilterField && ui.extra && ui.extra!=='전체'){
      if(m.extraFilterField==='occurType'){ matchE = occCategory(r.occurType)===ui.extra; }
      else if(m.extraKnown && ui.extra==='일반'){ matchE = m.extraKnown.indexOf(r[m.extraFilterField])===-1; }
      else { matchE = r[m.extraFilterField]===ui.extra; }
    }
    var matchD = true;
    if(m.dateRangeFilter && m.yearFilterField && (ui.from || ui.to)){
      var dd = String(r[m.yearFilterField]||'').slice(0,10);
      matchD = !!dd && (!ui.from || dd>=ui.from) && (!ui.to || dd<=ui.to);
    }
    return matchQ && matchS && matchY && matchE && matchD;
  });
}

/* Bulk-assign an owner (name + email) to every record currently shown in a
   module's list (i.e. respecting whatever search/status/year filter is

var listCtxModKey = null;

/* ============================= CLAIM TREND / 6-MONTH FORECAST ============================= */
var claimFc = {open:false, sel:null, fitN:12, histN:24, occ:'전체', part:'전체', view:'mis', misSel:null, misBin:3};
var FC_COLORS = ['#2563eb','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#4b5563','#65a30d','#ea580c','#0d9488','#9333ea','#a16207'];
function fcSerColor(s, ci){ return (s && s.rs4) ? '#0f172a' : FC_COLORS[ci%FC_COLORS.length]; }
function fcMonthKey(d){ return normDateStr(d).slice(0,7); }
function fcAddMonths(key, n){ var y=+key.slice(0,4), m=+key.slice(5,7)-1+n; y += Math.floor(m/12); m = ((m%12)+12)%12; return y+'-'+String(m+1).padStart(2,'0'); }
function fcMonthsBetween(a,b){ var out=[], k=a; while(k<=b && out.length<240){ out.push(k); k=fcAddMonths(k,1); } return out; }
function fcLinReg(ys){
  var n=ys.length, sx=0, sy=0, sxx=0, sxy=0, i;
  for(i=0;i<n;i++){ sx+=i; sy+=ys[i]; sxx+=i*i; sxy+=i*ys[i]; }
  var den = n*sxx - sx*sx, slope = den ? (n*sxy - sx*sy)/den : 0, icpt = (sy - slope*sx)/n;
  var sse=0; for(i=0;i<n;i++){ var e = ys[i]-(icpt+slope*i); sse+=e*e; }
  var sd = n>2 ? Math.sqrt(sse/(n-2)) : 0;
  return {slope:slope, icpt:icpt, sd:sd, n:n};
}
function fcBuild(){
  var rows = (state.claims||[]).filter(function(r){
    if(fcMonthKey(r.date).length!==7) return false;
    if(claimFc.occ!=='전체' && occCategory(r.occurType)!==claimFc.occ) return false;
    if(claimFc.part!=='전체' && r.part!==claimFc.part) return false;
    return true;
  });
  var now = new Date(), curKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var lastFull = fcAddMonths(curKey,-1);                       // 진행 중인 이번 달은 제외(미완료)
  var valid = rows.filter(function(r){ return fcMonthKey(r.date)<=lastFull; });
  if(!valid.length) return null;
  var first = valid.reduce(function(a,r){ var k=fcMonthKey(r.date); return k<a?k:a; }, '9999-99');
  var minStart = fcAddMonths(lastFull, -(claimFc.histN-1));
  if(first<minStart) first = minStart;
  var months = fcMonthsBetween(first, lastFull);
  var fut = []; for(var i=1;i<=6;i++) fut.push(fcAddMonths(lastFull,i));
  var byModel = {}, total = months.map(function(){return 0;}), disp = {};
  valid.forEach(function(r){
    var k = fcMonthKey(r.date), idx = months.indexOf(k); if(idx<0) return;
    var raw = String(r.model||'').trim() || '(차종 미입력)', name = raw.toUpperCase().replace(/\s+/g,' ');
    if(!disp[name]) disp[name]=raw;
    var c = parseFloat(r.count); if(isNaN(c)) c = 1;
    if(!byModel[name]) byModel[name] = months.map(function(){return 0;});
    byModel[name][idx] += c; total[idx] += c;
  });
  var series = Object.keys(byModel).map(function(n){ return {key:n, label:disp[n], vals:byModel[n], sum:byModel[n].reduce(function(a,b){return a+b;},0)}; })
    .sort(function(a,b){ return b.sum-a.sum; });
  series.unshift({key:'__TOTAL__', label:'전체 합계', vals:total, sum:total.reduce(function(a,b){return a+b;},0)});
  series.forEach(function(s){
    var fitVals = s.vals.slice(-claimFc.fitN);
    var reg = fcLinReg(fitVals), n = fitVals.length;
    s.reg = reg; s.fitN = n;
    s.fc = fut.map(function(_,j){ var x = n+j; return Math.max(0, reg.icpt + reg.slope*x); });
    s.band = fut.map(function(_,j){ var x = n+j, mid = reg.icpt+reg.slope*x, w = 1.28*reg.sd*Math.sqrt(1+1/n+Math.pow(x-(n-1)/2,2)/Math.max(1,(n*(n*n-1)/12))); return {lo:Math.max(0,mid-w), hi:Math.max(0,mid+w)}; });
    s.fcSum = s.fc.reduce(function(a,b){return a+b;},0);
    s.prev6 = s.vals.slice(-6).reduce(function(a,b){return a+b;},0);

}
function fcFmt(v){ return (Math.round(v*10)/10).toLocaleString(undefined,{maximumFractionDigits:1}); }

/* ---- 사용개월수(MIS)별 발생 건수 + 48개월까지 예측 : 사용개월수는 '발생구분' 표기에서 읽는다 (0km=0, 3M=3, 12M=12, 1년=12 ...) ---- */
function fcMisParse(v){
  var s = String(v==null?'':v).toLowerCase().replace(/\s+/g,'');
  if(!s) return null;
  if(/^0?km$|^0km|^0\.?km|^제로|^0$/.test(s)) return 0;
  var m = s.match(/(\d+(?:\.\d+)?)(년|yrs?|years?|y(?![a-z]))/);
  if(m) return Math.round(parseFloat(m[1])*12);
  m = s.match(/(\d+(?:\.\d+)?)/);
  if(m && /(m|mis|개월|month|mo)/.test(s)) return Math.round(parseFloat(m[1]));
  return null;
}
function fcMisBin(mis){ return mis===0 ? 0 : Math.ceil(mis/claimFc.misBin); }
function fcMisLabel(b){ var w=claimFc.misBin; if(b===0) return '0km'; return w===1 ? String(b) : (((b-1)*w+1)+'~'+(b*w)); }
function fcMisBuild(){
  var w = claimFc.misBin, capB = fcMisBin(12), hB = Math.ceil(36/w), rB = Math.ceil(48/w);
  var rows = (state.claims||[]).filter(function(r){ return claimFc.part==='전체' || r.part===claimFc.part; });
  var excl = 0, over = 0, parsed = [], disp = {}, rs4Max = 0;
  rows.forEach(function(r){
    var mis = null;
    if(r.misMonths!==undefined && r.misMonths!==null && String(r.misMonths).trim()!=='' && !isNaN(parseFloat(r.misMonths))){ mis = Math.max(0, Math.round(parseFloat(r.misMonths))); }
    else { mis = fcMisParse(r.occurType); }
    if(mis===null || mis>240){ excl++; return; }
    var raw = String(r.model||'').trim() || '(차종 미입력)', name = raw.toUpperCase().replace(/\s+/g,' ');
    var isRS4 = name.indexOf('RS4')>-1, b = fcMisBin(mis);
    if(!isRS4 && b>capB){ over++; return; }                       // RS4 외 차종은 12개월까지만 구분 → 그 이후 값은 사용하지 않음
    if(!disp[name]) disp[name] = raw;
    var c = parseFloat(r.count); if(isNaN(c)) c = 1;
    if(isRS4 && b>rs4Max) rs4Max = b;
    parsed.push({name:name, b:b, c:c, rs4:isRS4});
  });
  if(!parsed.length) return {empty:true, excl:excl, total:rows.length};
  var hasRS4 = parsed.some(function(p){ return p.rs4; });
  var endB = hasRS4 ? Math.max(rB, rs4Max) : hB;
  if(hasRS4) rs4Max = Math.max(rs4Max, rB);                       // RS4는 48개월까지 실적 구간으로 취급
  var by = {}, isR = {};
  parsed.forEach(function(p){
    if(!by[p.name]){
      var obs = p.rs4 ? Math.max(rs4Max, capB) : capB;
      by[p.name] = {obs:obs, vals:[]};
      for(var i=0;i<=obs;i++) by[p.name].vals.push(0);
      isR[p.name] = p.rs4;
    }
    by[p.name].vals[p.b] += p.c;
  });
  var series = Object.keys(by).map(function(n){ return {key:n, label:disp[n], vals:by[n].vals, obsMax:by[n].obs, rs4:isR[n], horizon: isR[n] ? endB : hB}; });
  series.forEach(function(s){
    s.sum = s.vals.reduce(function(a,b){return a+b;},0);
    s.zero = s.vals[0];
    var ys = s.vals.slice(1);                                    // 0km 는 추세 계산에서 제외
    s.canFc = ys.length>=2;
    s.fc = []; s.band = [];
    s.reg = {slope:0}; s.fcSum = 0;
    if(s.canFc){
      var reg = fcLinReg(ys), n = ys.length; s.reg = reg;
      for(var b=s.obsMax+1; b<=s.horizon; b++){
        var i = b-1, mid = reg.icpt + reg.slope*i;
        var wd = 1.28*reg.sd*Math.sqrt(1+1/n+Math.pow(i-(n-1)/2,2)/Math.max(1,(n*(n*n-1)/12)));
        s.fc.push(Math.max(0,mid)); s.band.push({lo:Math.max(0,mid-wd), hi:Math.max(0,mid+wd)});
      }
      s.fcSum = s.fc.reduce(function(a,b){return a+b;},0);
      if(s.rs4){                                                    // RS4: 실적이 전 구간 있으므로, 0km~끝까지 전 구간의 예상 수량(점선)을 따로 계산
        s.exp = s.vals.map(function(v,bi){ return bi===0 ? v : Math.max(0, reg.icpt + reg.slope*(bi-1)); });
        s.fcSum = s.exp.reduce(function(a,b){return a+b;},0);
      }
    }
    var last = 0; for(var k=s.vals.length-1;k>=0;k--){ if(s.vals[k]>0){ last=k; break; } }
    s.lastB = last;
  });
  series.sort(function(a,b){ return b.sum-a.sum; });
  // 전체 합계: 각 차종의 (실적 또는 예측)을 합산. 12개월까지 실선, 이후는 예측이 섞이므로 점선
  var tv = [], tf = [];
  for(var bb=0; bb<=endB; bb++){
    var t = 0;
    series.forEach(function(s){ if(bb<=s.obsMax) t += s.vals[bb]; else if(s.canFc && bb<=s.horizon) t += s.fc[bb-s.obsMax-1]; });
    if(bb<=capB) tv.push(t); else tf.push(t);
  }
  var tot = {key:'__TOTAL__', label:'전체 합계', vals:tv, obsMax:capB, rs4:false, horizon:endB, canFc:tf.length>0, fc:tf, band:[], reg:{slope: tf.length ? (tf[tf.length-1]-tf[0]) : 0}};
  tot.sum = series.reduce(function(a,s){return a+s.sum;},0);
  tot.zero = series.reduce(function(a,s){return a+s.zero;},0);
  tot.fcSum = tf.reduce(function(a,b){return a+b;},0);
  tot.lastB = capB;
  series.unshift(tot);
  return {series:series, maxB:capB, capB:capB, endB:endB, excl:excl, over:over, used:parsed.length, total:rows.length, hasRS4:hasRS4};
}

function fcBindMis(wrap){

  sel.forEach(function(s,ci){

      svg += '<polygon points="'+X(n0-1)+','+Y(s.vals[n0-1])+' '+up.join(' ')+' '+lo.join(' ')+' '+X(n0-1)+','+Y(s.vals[n0-1])+'" fill="'+col+'" opacity=".12"/>';

    s.vals.forEach(function(v,i){ svg += '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="'+col+'"><title>'+escAttr(s.label)+' '+D.months[i]+': '+fcFmt(v)+'건</title></circle>'; });
    s.fc.forEach(function(v,j){ svg += '<circle cx="'+X(n0+j)+'" cy="'+Y(v)+'" r="3.4" fill="#fff" stroke="'+col+'" stroke-width="2"><title>'+escAttr(s.label)+' '+D.fut[j]+' 예측: '+fcFmt(v)+'건</title></circle>'; });
    if(sel.length===1){ s.fc.forEach(function(v,j){ svg += '<text x="'+X(n0+j)+'" y="'+(Y(v)-9)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+col+'">'+fcFmt(v)+'</text>'; }); }

  html += '<div style="overflow-x:auto;">'+svg+'</div>';
  html += '<p class="panel-sub" style="margin:4px 0 8px;">실선=실적(월별 접수 건수), 점선·빈 원=예측'+(sel.length===1?', 옅은 영역=80% 예측 범위':'')+'. 차종 버튼을 눌러 그래프에 표시할 차종을 바꿀 수 있습니다.</p>';

/* ============================= NAME AUTOCOMPLETE (담당자/공급업체 자동완성) =============================
   A native <input list="..."> + <datalist> was used previously, but Chrome fails to show the
   suggestion popup when the input sits inside a scrollable container (our modal body uses
   max-height + overflow-y:auto), so the dropdown never appeared. This implements the same
   behavior manually with a floating, position:fixed suggestion box appended to <body>, which
   is never clipped by an ancestor's scroll area. */
var acBox = null;
function acSourceList(name){
  if(name==='staffNameList') return state.staff.map(function(s){return s.name;}).filter(Boolean);
  if(name==='supplierNameList') return state.suppliers.map(function(s){return s.name;}).filter(Boolean);
  return [];
}
function getAcBox(){
  if(!acBox){
    acBox = document.createElement('div');
    acBox.className = 'ac-dropdown';
    acBox.hidden = true;
    document.body.appendChild(acBox);
  }
  return acBox;
}
function positionAcBox(input, box){
  var r = input.getBoundingClientRect();
  box.style.left = r.left+'px';
  box.style.top = (r.bottom+4)+'px';
  box.style.width = r.width+'px';
}
function hideAcBox(){ if(acBox){ acBox.hidden = true; acBox._forInput = null; } }
function showAcSuggestions(input){
  var all = acSourceList(input.getAttribute('data-ac-source'));
  var q = input.value.trim().toLowerCase();
  var matches = (q ? all.filter(function(n){ return n.toLowerCase().indexOf(q)>-1; }) : all).slice(0,8);
  var box = getAcBox();
  if(!matches.length){ hideAcBox(); return; }
  box.innerHTML = matches.map(function(n){ return '<div class="ac-item">'+escAttr(n)+'</div>'; }).join('');
  positionAcBox(input, box);
  box.hidden = false;
  box._forInput = input;
}
document.addEventListener('input', function(e){
  if(e.target && e.target.matches && e.target.matches('[data-ac-source]')){ showAcSuggestions(e.target); }
});
document.addEventListener('focusin', function(e){

function fmtFileSize(b){
  if(!b) return '0B';
  if(b<1024) return b+'B';
  if(b<1024*1024) return (b/1024).toFixed(1)+'KB';
  return (b/1024/1024).toFixed(2)+'MB';
}

var MAIL_FOOTER = '* 참고 - 본 메일은 QMS에서 발송하는 메일로 본 메일 발송인과는 무관함';
function withMailFooter(body){ return String(body||'').replace(/\s+$/,'') + '\n\n' + MAIL_FOOTER; }

function openMailDraft(modKey, r, isNew){
  var m = MODULES[modKey];
  if(!m.mail) return;
  var email = r[mailFieldName(m.mail,'email')];
  if(!email) return;
  var subject = encodeURIComponent(m.mail.saveSubject(r, isNew));
  var body = encodeURIComponent(withMailFooter(m.mail.saveBody(r, isNew)));
  window.location.href = 'mailto:'+email+'?subject='+subject+'&body='+body;

function readFileAsRecord(file){
  // Files are embedded as base64 data URLs (never uploaded anywhere) so this
  // page stays a single self-contained file that opens correctly for anyone,
  // even with no network access.
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(ev){ resolve({name:file.name, type:file.type, size:file.size, dataUrl:ev.target.result}); };
    reader.onerror = function(){ reject(new Error('read error')); };
    reader.readAsDataURL(file);
  });
}

function handleExcelImport(modKey, file){
  var m = MODULES[modKey];
  if(!m || !m.excelImport) return;
  if(typeof XLSX === 'undefined'){ showToast('엑셀 처리 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.'); return; }
  var cfg = m.excelImport;
  var sheetCfgs = cfg.sheets && cfg.sheets.length ? cfg.sheets : [{sheetName:cfg.sheetName, headerRowIndex:cfg.headerRowIndex, parseRow:cfg.parseRow}];
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array'});
      var matchKey = cfg.matchKey || 'equipNo';
      var added = 0, updated = 0, sheetsFound = 0, changedMap = {};
      sheetCfgs.forEach(function(sc){
        var sheet = wb.Sheets[sc.sheetName] || (sheetCfgs.length===1 ? wb.Sheets[wb.SheetNames[0]] : null);
        if(!sheet) return;
        sheetsFound++;
        var matrix = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null});
        var startIdx = sc.headerRowIndex || 0;
        for(var i=startIdx; i<matrix.length; i++){
          var row = matrix[i];
          if(!row) continue;
          var parsed = sc.parseRow(row);
          if(!parsed) continue;
          var existingIdx = -1;
          if(matchKey && parsed[matchKey]){
            existingIdx = state[modKey].findIndex(function(r){ return r[matchKey] === parsed[matchKey]; });
          }
          if(existingIdx>-1){
            state[modKey][existingIdx] = Object.assign({}, state[modKey][existingIdx], parsed);
            changedMap[state[modKey][existingIdx].id] = state[modKey][existingIdx];
            updated++;
          } else {
            parsed.id = uid(m.idPrefix);
            state[modKey].unshift(parsed);
            changedMap[parsed.id] = parsed;
            added++;
          }
        }
      });
      if(sheetsFound===0){ showToast('시트를 찾을 수 없습니다.'); return; }
      if(added===0 && updated===0){ showToast('가져올 데이터를 찾지 못했습니다. 파일 형식을 확인해주세요.'); return; }
      if(isGuest){ showToast('게스트 계정은 조회만 가능합니다. 수정하려면 품질팀 계정으로 로그인해주세요.'); return; }
      renderMenu();
      rerenderModule(modKey);
      // 전체 데이터를 다시 저장하면 화면이 멈추므로, 변경·추가된 건만 저장한다.
      var changed = Object.keys(changedMap).map(function(k){ return changedMap[k]; }).filter(function(r){ return r && r.id; });
      showToast('엑셀 저장 중... ('+changed.length+'건)');
      pendingSaveCount++;
      bulkPersistNewRecords(modKey, changed, function(d,t){ showToast('엑셀 저장 중... '+d+'/'+t); }).then(function(){
        showToast('엑셀 업로드 완료: 신규 '+added+'건, 업데이트 '+updated+'건');
      }).catch(function(err){
        console.error(err);
        showToast('저장 중 오류가 발생했습니다: '+((err&&err.message)||''));
      }).finally(function(){ pendingSaveCount--; });
    }catch(err){
      showToast('엑셀 파일을 읽는 중 오류가 발생했습니다.');
    }
  };
  reader.onerror = function(){ showToast('파일을 읽는 중 오류가 발생했습니다.'); };
  reader.readAsArrayBuffer(file);
}

function saveModal(){
  if(!modalCtx) return;
  var m = MODULES[modalCtx.modKey];
  var wantMailNotify = !!m.mail && document.getElementById('ccMailNotify') && document.getElementById('ccMailNotify').checked;
  var isNewRecord = !modalCtx.id;
  var data = {};
  var missing = [];
  m.fields.forEach(function(f){
    var el = document.getElementById('f_'+f.key);
    var v = el ? el.value : '';
    if(f.type==='number'){ v = v===''?'':parseFloat(v); }
    if(f.type==='select_other' && v===(f.otherLabel||'기타')){
      var otherEl = document.getElementById('f_'+f.key+'_other');
      var otherVal = otherEl ? otherEl.value.trim() : '';
      if(otherVal){ v = otherVal; }
      else if(!f.otherOptional){ missing.push(f.label+'(기타 내용 입력)'); }
    }
    if(f.required && (v===''||v===undefined||v===null)){ missing.push(f.label); }
    data[f.key] = v;
  });
  if(missing.length){ showToast('필수 항목을 입력해주세요: '+missing.join(', ')); return; }

  function finishSave(){
    var savedRecord;
    var isEdit = !!modalCtx.id;
    if(modalCtx.id){
      var idx = state[modalCtx.modKey].findIndex(function(r){return r.id===modalCtx.id;});
      if(idx>-1){ state[modalCtx.modKey][idx] = Object.assign({}, state[modalCtx.modKey][idx], data); savedRecord = state[modalCtx.modKey][idx]; }
    } else {
      data.id = uid(m.idPrefix);
      state[modalCtx.modKey].unshift(data);
      savedRecord = data;
    }
    // The success toast only fires once the write actually reaches
    // Firestore -- showing it beforehand looked like confirmation but the
    // save could still be lost if the tab was closed in that gap. Only
    // this one record is written (persistRecord), not persist()'s broad
    // re-save of every record in the module -- see the note above
    // persistRecord for why that matters with more than one person using
    // the app at once.
    persistRecord(modalCtx.modKey, savedRecord).then(function(){ showToast(isEdit ? '저장되었습니다.' : '등록되었습니다.'); });
    var savedModKey = modalCtx.modKey;
    closeModal();
    renderMenu();
    rerenderModule(savedModKey);
    if(wantMailNotify && savedRecord){ openMailDraft(savedModKey, savedRecord, isNewRecord); }
  }

  finishSave();
}

function b64ToUtf8(b64){
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for(var i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}
var _embeddedToolHtmlCache = {};

  _embeddedToolHtmlCache[elId] = html;
  return html;
}

    var email = document.getElementById('stfEmail').value.trim();

    if(!name || !email){ showToast('이름과 이메일을 입력해주세요.'); return; }
    var newStaff = {id: uid('STF'), name:name, email:email, team:team};
    state.staff.push(newStaff);
    renderSettings();
    persistRecord('staff', newStaff).then(function(){ showToast('담당자가 추가되었습니다.'); });

/* ============================= TOAST ============================= */
var toastTimer=null;
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ============================= MAIN RENDER ============================= */
var CRUMBS = {dashboard:'대시보드', settings:'설정', claimcost:'고객 클레임 비용 분석', processdefect:'공정별 불량 현황', kpi:'품질 KPI 대시보드'};
MODULE_ORDER.forEach(function(k){ CRUMBS[k] = MODULES[k].label; });

function render(){
  var route = currentRoute();
  document.getElementById('crumbTitle').textContent = CRUMBS[route] || '대시보드';
  renderMenu();
  if(route==='dashboard'){ renderDashboard(); }
  else if(route==='settings'){ renderSettings(); }
  else if(route==='claimcost'){ renderClaimCostDashboard(); }
  else if(route==='processdefect'){ renderProcessDefectDashboard(); }
  else if(route==='kpi'){ renderKpiDashboard(); }
  else if(route==='suppliers'){ renderSupplierPage(); }
  else if(route==='inspectionLog'){ renderPdsPage(); }
  else if(MODULES[route]){ renderList(route); }
  else { go('dashboard'); }
}

function tickClock(){
  var el = document.getElementById('clock');
  if(!el) return;
  var d = new Date();
  var days=['일','월','화','수','목','금','토'];
  var s = d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+'('+days[d.getDay()]+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  el.textContent = s;
}

/* ============================= INIT ============================= */
document.addEventListener('DOMContentLoaded', function(){
  applyTheme();
  stateReadyPromise.then(function(){
  appStarted = true;
  render();
  restoreLocalFileHandle();
  tickClock();
  setInterval(tickClock, 15000);
  document.getElementById('exportSnapshotBtn').addEventListener('click', exportSnapshot);
  if(window._pendingMergeNotice){
    var pn = window._pendingMergeNotice;
    showToast('이 파일(v'+pn.ver+')의 데이터를 이 PC에 병합했습니다: 신규 '+pn.added+'건 · 갱신 '+pn.updated+'건');
    persist();
    delete window._pendingMergeNotice;
  }

  document.getElementById('menuToggle').addEventListener('click', function(){
    document.getElementById('sidebar').classList.toggle('open');
  });
  document.getElementById('themeBtn').addEventListener('click', function(){
    theme = theme==='system' ? 'dark' : (theme==='dark' ? 'light' : 'system');
    try{ localStorage.setItem(STORE_KEY+'_theme', theme); }catch(e){}
    applyTheme();
  });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', saveModal);
  document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id==='overlay') closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !document.getElementById('overlay').hidden) closeModal(); });

  document.body.addEventListener('click', function(e){
    var dlBtn = e.target.closest ? e.target.closest('[data-dl-id]') : null;
    if(dlBtn){
      e.preventDefault();
      e.stopPropagation();
      downloadStoredFile(FILE_REGISTRY[dlBtn.getAttribute('data-dl-id')]);
    }
  });

  document.getElementById('content').addEventListener('click', function(e){
    var dashEl = e.target.closest ? e.target.closest('[data-dash-route]') : null;
    if(dashEl){
      dashNavigate(dashEl.getAttribute('data-dash-route'), {
        status: dashEl.getAttribute('data-dash-status'),
        extra: dashEl.getAttribute('data-dash-extra'),
        q: dashEl.getAttribute('data-dash-id')
      });
      return;
    }
    var delBtn = e.target.closest ? e.target.closest('[data-staff-del]') : null;
    if(delBtn){
      var delId = delBtn.getAttribute('data-staff-del');
      state.staff = state.staff.filter(function(s){ return s.id !== delId; });
      renderSettings();
      persistDelete('staff', delId);
      return;
    }
    var editBtn = e.target.closest ? e.target.closest('[data-act="edit"]') : null;
    if(editBtn && listCtxModKey){
      openModal(listCtxModKey, editBtn.getAttribute('data-id'));
      return;
    }
    var rowDelBtn = e.target.closest ? e.target.closest('[data-act="del"]') : null;
    if(rowDelBtn && listCtxModKey){
      deleteRow(listCtxModKey, rowDelBtn.getAttribute('data-id'));
      return;
    }
    var tabBtn = e.target.closest ? e.target.closest('[data-supplier-tab]') : null;
    if(tabBtn){
      supplierActiveTab = tabBtn.getAttribute('data-supplier-tab');
      renderSupplierPage();
      return;
    }
    var evalBtn = e.target.closest ? e.target.closest('[data-eval-key]') : null;
    if(evalBtn){
      showEvalEditor(evalBtn.getAttribute('data-eval-key'), evalBtn.getAttribute('data-eval-label'));
      return;
    }
    var docBtn = e.target.closest ? e.target.closest('[data-doc-kind]') : null;
    if(docBtn){
      showDocEditor(docBtn.getAttribute('data-doc-kind'), docBtn.getAttribute('data-doc-key'), docBtn.getAttribute('data-doc-label'));
      return;
    }
    var bulkBtn = e.target.closest ? e.target.closest('[data-bulk-assign-mod]') : null;
    if(bulkBtn){
      showBulkAssignModal(bulkBtn.getAttribute('data-bulk-assign-mod'));
      return;
    }
    var pdsTabBtn = e.target.closest ? e.target.closest('[data-pds-tab]') : null;
    if(pdsTabBtn){
      pdsActiveTab = pdsTabBtn.getAttribute('data-pds-tab');
      renderPdsPage();
      return;
    }
    var pdsToggleAll = e.target.closest ? e.target.closest('[data-pds-toggle-all]') : null;
    if(pdsToggleAll){
      e.preventDefault();
      var tkey = pdsToggleAll.getAttribute('data-pds-toggle-all');
      pdsShowAll[tkey] = !pdsShowAll[tkey];
      renderPdsTabBody();
      return;
    }
    var pdsAddBtn = e.target.closest ? e.target.closest('[data-pds-addrow]') : null;
    if(pdsAddBtn){
      if(isGuest){ showToast('게스트 계정은 조회만 가능합니다. 수정하려면 품질팀 계정으로 로그인해주세요.'); return; }
      var kind = pdsAddBtn.getAttribute('data-pds-addrow');

      if(kind==='insp'){
        newRec = {id:uid('PD'), line:pdsAddBtn.getAttribute('data-pds-line'), inspDate:todayISO(), workerName:'', category:'', doorName:'', lotNo:'', qtyInspected:'', qtyOk:'', qtyNok:'', note:''};
        state.inspectionLog.push(newRec);
        persistRecord('inspectionLog', newRec);
      } else {
        var dModKey = pdsAddBtn.getAttribute('data-pds-modkey');
        newRec = {id:uid(pdsAddBtn.getAttribute('data-pds-idprefix')), date:todayISO(), doorNum:'', doorName:'', qty:'', note:''};
        state[dModKey].push(newRec);
        persistRecord(dModKey, newRec);
      }
      renderMenu();
      renderPdsTabBody();
      return;
    }
    var pdsDelBtn = e.target.closest ? e.target.closest('[data-pds-del]') : null;
    if(pdsDelBtn){
      deleteRow(pdsDelBtn.getAttribute('data-pds-modkey'), pdsDelBtn.getAttribute('data-pds-del'));
      return;
    }
    var pdsUnitEl = e.target.closest ? e.target.closest('[data-pds-unit]') : null;
    if(pdsUnitEl){ pdsChartUnit = pdsUnitEl.getAttribute('data-pds-unit')==='day' ? 'day' : 'month'; renderPdsStatus(); return; }

    if(pdsFilterResetBtn){
      pdsAnalysisFilter = {year:'전체', startDate:'', endDate:'', carModel:'전체', doorName:'전체'};
      renderPdsStatus();
      return;
    }
  });

  document.getElementById('content').addEventListener('change', function(e){
    var yearSel = e.target.closest ? e.target.closest('[data-status-year-select]') : null;

        rec[pdsFieldEl.getAttribute('data-pds-field')] = pdsFieldEl.value;
        persistRecord(pModKey, rec);
        renderPdsTabBody();
      }
      return;
    }
    var pdsFilterEl = e.target.closest ? e.target.closest('[data-pds-filter]') : null;
    if(pdsFilterEl){
      var fkey = pdsFilterEl.getAttribute('data-pds-filter');

      else if(fkey==='carModel'){ pdsAnalysisFilter.carModel = pdsFilterEl.value; }
      else if(fkey==='doorName'){ pdsAnalysisFilter.doorName = pdsFilterEl.value; }
      renderPdsStatus();
      return;
    }
  });
  }); // end stateReadyPromise.then
});

})();

var I18N_PATTERNS = [
 [/^전체 (\d+)건 중 (\d+)건 표시/, 'Showing $2 of $1'],
 [/^전체 (\d+)건$/, 'Total $1'],
 [/^(\d+)건 표시 중/, 'Showing $1'],
 [/^임박\(7일 이내\) (\d+)건/, 'Upcoming (within 7 days) $1'],

 [/^진행중 (\d+)/, 'In progress $1'],
 [/^(\d{4})\.(\d{2})\.(\d{2})\((일|월|화|수|목|금|토)\)/, function(m,a,b,c,d){ return a+'.'+b+'.'+c+' ('+{'일':'Sun','월':'Mon','화':'Tue','수':'Wed','목':'Thu','금':'Fri','토':'Sat'}[d]+')'; }],
 [/^(\d+)년 (\d+)월$/, '$1-$2'],
 [/^(\d+)건$/, '$1 items'],
 [/^(\d+)개월$/, '$1 months']
];

/* ===== KO/EN language switch (DOM translation layer) ===== */
(function(){
  var HANGUL = /[가-힣]/;
  var lang = 'ko';
  try{ lang = localStorage.getItem('qmsLang') === 'en' ? 'en' : 'ko'; }catch(e){}
  var phraseKeys = Object.keys(I18N_DICT).filter(function(k){ return k.length >= 5; }).sort(function(a,b){ return b.length - a.length; });
  var origText = new WeakMap();   // text node -> original Korean
  var origAttr = new WeakMap();   // element -> {attr: original}
  var ATTRS = ['placeholder','title','aria-label','alt'];
  var docs = [];                  // [{doc, observer}]
  var busy = false;

  function tr(str){
    if(!str || !HANGUL.test(str)) return str;
    var lead = str.match(/^\s*/)[0], trail = str.match(/\s*$/)[0];
    var core = str.trim();
    if(Object.prototype.hasOwnProperty.call(I18N_DICT, core)) return lead + I18N_DICT[core] + trail;
    for(var i=0;i<I18N_PATTERNS.length;i++){
      var p = I18N_PATTERNS[i];
      if(p[0].test(core)){ return lead + core.replace(p[0], p[1]) + trail; }
    }
    var out = core;
    for(var j=0;j<phraseKeys.length;j++){
      var k = phraseKeys[j];
      if(out.indexOf(k) > -1){ out = out.split(k).join(I18N_DICT[k]); }
    }
    return lead + out + trail;
  }

  function skipNode(n){
    var p = n.parentNode;
    if(!p) return true;
    var tag = p.nodeName;
    return tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TEXTAREA' || tag === 'CODE';
  }

  function translateTextNode(n){
    if(skipNode(n)) return;
    var v = n.nodeValue;
    if(!HANGUL.test(v)) return;
    var t = tr(v);
    if(t !== v){ if(!origText.has(n)) origText.set(n, v); n.nodeValue = t; }
  }
  function translateAttrs(el){
    if(!el.getAttribute) return;
    ATTRS.forEach(function(a){
      var v = el.getAttribute(a);
      if(v && HANGUL.test(v)){
        var t = tr(v);
        if(t !== v){
          var m = origAttr.get(el); if(!m){ m = {}; origAttr.set(el, m); }
          if(!(a in m)) m[a] = v;
          el.setAttribute(a, t);
        }
      }
    });
    if(el.nodeName === 'INPUT' && (el.type === 'button' || el.type === 'submit') && HANGUL.test(el.value||'')){
      var t2 = tr(el.value); if(t2 !== el.value){ var m2 = origAttr.get(el); if(!m2){ m2 = {}; origAttr.set(el, m2); } if(!('value' in m2)) m2.value = el.value; el.value = t2; }
    }
  }
  function walk(root){
    if(!root) return;
    if(root.nodeType === 3){ translateTextNode(root); return; }
    if(root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
    if(root.nodeType === 1){ translateAttrs(root); }
    var doc = root.ownerDocument || root;
    var tw = doc.createTreeWalker(root, 1 | 4, null);   // elements + text
    var n;
    while((n = tw.nextNode())){
      if(n.nodeType === 3) translateTextNode(n); else translateAttrs(n);
    }
  }
  function restore(root){
    // restore originals for nodes we translated (walk and look up the WeakMaps)
    var doc = root.ownerDocument || root;
    var tw = doc.createTreeWalker(root, 1 | 4, null);
    var n;
    while((n = tw.nextNode())){
      if(n.nodeType === 3){ if(origText.has(n)){ n.nodeValue = origText.get(n); origText.delete(n); } }
      else if(origAttr.has(n)){
        var m = origAttr.get(n);
        Object.keys(m).forEach(function(a){ if(a === 'value') n.value = m[a]; else n.setAttribute(a, m[a]); });
        origAttr.delete(n);
      }
    }
  }

  function attachDoc(doc){
    if(!doc || !doc.body) return;
    for(var i=0;i<docs.length;i++){ if(docs[i].doc === doc) return; }
    var entry = {doc: doc, pending: false, nodes: []};
    var obs = new MutationObserver(function(muts){
      if(lang !== 'en') return;
      muts.forEach(function(m){
        if(m.type === 'childList'){ m.addedNodes.forEach(function(n){ entry.nodes.push(n); }); }
        else if(m.type === 'characterData'){ entry.nodes.push(m.target); }
        else if(m.type === 'attributes'){ entry.nodes.push(m.target); }
      });
      if(entry.pending) return;
      entry.pending = true;
      (doc.defaultView || window).requestAnimationFrame(function(){
        entry.pending = false;
        var list = entry.nodes; entry.nodes = [];
        list.forEach(function(n){ walk(n); });
      });
    });
    obs.observe(doc.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:ATTRS});
    entry.observer = obs;
    docs.push(entry);
    if(lang === 'en') walk(doc.body);
  }

  function scanFrames(){
    var frames = document.querySelectorAll('iframe');
    frames.forEach(function(f){
      try{
        var d = f.contentDocument;
        if(d && d.body){
          // iframe docs get replaced on srcdoc reload: drop stale entries
          docs = docs.filter(function(x){ return x.doc === document || !!x.doc.defaultView; });
          attachDoc(d);
        }
        if(!f.__i18nHooked){ f.__i18nHooked = true; f.addEventListener('load', function(){ try{ attachDoc(f.contentDocument); }catch(e){} }); }
      }catch(e){}
    });
  }

  function updateButton(){
    var b = document.getElementById('langBtn');
    if(b){ b.textContent = lang === 'en' ? 'EN' : 'KO'; b.title = lang === 'en' ? 'Switch to Korean (한국어)' : 'Switch to English'; b.setAttribute('data-lang', lang); }
    var b2 = document.getElementById('loginLangBtn');
    if(b2){ b2.textContent = lang === 'en' ? 'EN' : 'KO'; }
    document.documentElement.setAttribute('lang', lang);
  }

  function setLang(next){
    lang = next === 'en' ? 'en' : 'ko';
    try{ localStorage.setItem('qmsLang', lang); }catch(e){}
    updateButton();
    docs.forEach(function(e){ try{ if(lang === 'en') walk(e.doc.body); else restore(e.doc.body); }catch(err){} });
    if(lang === 'ko'){ restore(document.body); }
    scanFrames();
    // let the app redraw anything that is built from JS strings (clock etc.)
    try{ if(typeof window.__qmsAfterLang === 'function') window.__qmsAfterLang(lang); }catch(e){}
  }

  window.QMS_I18N = { setLang: setLang, getLang: function(){ return lang; }, tr: tr, scan: scanFrames };

  function init(){
    attachDoc(document);
    docs = docs.filter(function(e){ return true; });
    updateButton();
    ['langBtn','loginLangBtn'].forEach(function(id){
      var b = document.getElementById(id);
      if(b && !b.__i18n){ b.__i18n = true; b.addEventListener('click', function(){ setLang(lang === 'en' ? 'ko' : 'en'); }); }
    });
    setInterval(scanFrames, 1200);   // embedded tools reload their documents when a file is chosen
    scanFrames();
    if(lang === 'en') walk(document.body);
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
