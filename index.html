<!DOCTYPE html>
<html data-theme="light"><head><title>STKR QMS</title>
<style>
:root{
  color-scheme: light;
  --bg:#eef1f5;
  --surface:#ffffff;
  --surface-2:#f6f8fa;
  --ink:#0f1a26;
  --ink-2:#4b5766;
  --muted:#8993a1;
  --line:#dde3ea;
  --line-strong:#c7d0da;
  --accent:#2a78d6;
  --accent-ink:#ffffff;
  --accent-dark:#184f95;
  --accent-soft:#e5eff9;
  --side-bg:#0f2540;
  --side-bg-2:#163756;
  --side-ink:#c9d7e8;
  --side-ink-dim:#7f96b0;
  --side-active:#1d4b78;
  --good:#0ca30c;
  --good-soft:#e4f6e0;
  --warning:#c67c00;
  --warning-soft:#fdf0d8;
  --serious:#c1531f;
  --serious-soft:#fbe3d6;
  --critical:#c23131;
  --critical-soft:#fbe1e1;
  --shadow: 0 1px 2px rgba(15,26,38,.06), 0 8px 24px -12px rgba(15,26,38,.18);
  --radius: 8px;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1218;
    --surface:#131b24;
    --surface-2:#182230;
    --ink:#eef2f6;
    --ink-2:#aeb9c6;
    --muted:#7c8896;
    --line:#25313f;
    --line-strong:#334252;
    --accent:#5b9be0;
    --accent-ink:#08131f;
    --accent-dark:#8ec0f2;
    --accent-soft:#173250;
    --side-bg:#081420;
    --side-bg-2:#0e1f31;
    --side-ink:#c9d7e8;
    --side-ink-dim:#6d84a0;
    --side-active:#1d3f61;
    --good:#41c552;
    --good-soft:#123420;
    --warning:#e3a63a;
    --warning-soft:#3a2c0f;
    --serious:#e68a52;
    --serious-soft:#3a2515;
    --critical:#ea6b6b;
    --critical-soft:#3a1717;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1218;
  --surface:#131b24;
  --surface-2:#182230;
  --ink:#eef2f6;
  --ink-2:#aeb9c6;
  --muted:#7c8896;
  --line:#25313f;
  --line-strong:#334252;
  --accent:#5b9be0;
  --accent-ink:#08131f;
  --accent-dark:#8ec0f2;
  --accent-soft:#173250;
  --side-bg:#081420;
  --side-bg-2:#0e1f31;
  --side-ink:#c9d7e8;
  --side-ink-dim:#6d84a0;
  --side-active:#1d3f61;
  --good:#41c552;
  --good-soft:#123420;
  --warning:#e3a63a;
  --warning-soft:#3a2c0f;
  --serious:#e68a52;
  --serious-soft:#3a2515;
  --critical:#ea6b6b;
  --critical-soft:#3a1717;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
.tnum{font-variant-numeric:tabular-nums;}
button,input,select,textarea{font:inherit;color:inherit;}
::selection{background:var(--accent-soft);}

#shell{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:236px;flex:0 0 236px;
  background:linear-gradient(180deg,var(--side-bg),var(--side-bg-2) 220px);
  color:var(--side-ink);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  transition:transform .2s ease;
  z-index:40;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:20px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand-mark{
  width:34px;height:34px;border-radius:7px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;
  flex:0 0 auto;
}
.brand-text .t1{font-weight:700;font-size:14.5px;color:#fff;letter-spacing:.2px;}
.brand-text .t2{font-size:11px;color:var(--side-ink-dim);margin-top:1px;letter-spacing:.4px;}

nav.menu{flex:1;overflow-y:auto;padding:12px 10px;}
.menu-group-label{
  font-size:10.5px;letter-spacing:.08em;color:var(--side-ink-dim);
  padding:14px 10px 6px;text-transform:uppercase;font-weight:600;
}
.menu-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:6px;margin-bottom:2px;
  color:var(--side-ink);text-decoration:none;cursor:pointer;
  font-size:13.3px;font-weight:500;border:1px solid transparent;
  background:transparent;width:100%;text-align:left;
}
.menu-item svg{flex:0 0 auto;opacity:.85;}
.menu-item:hover{background:rgba(255,255,255,.06);}
.menu-item.active{background:var(--side-active);color:#fff;border-color:rgba(255,255,255,.08);}
.menu-item.active svg{opacity:1;}
.menu-count{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--side-ink-dim);background:rgba(255,255,255,.06);
  padding:1px 6px;border-radius:20px;
}
.menu-item.active .menu-count{color:#fff;background:rgba(255,255,255,.16);}

.sidebar-foot{
  padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:var(--side-ink-dim);
}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:12px 22px;background:var(--surface);
  border-bottom:1px solid var(--line);
}
#menuToggle{
  display:none;border:1px solid var(--line);background:var(--surface);
  border-radius:6px;padding:6px;cursor:pointer;
}
.crumb{font-size:13px;color:var(--muted);}
.crumb b{color:var(--ink);font-weight:600;}
.topbar-spacer{flex:1;}
.topbar-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);}
.theme-btn{
  border:1px solid var(--line);background:var(--surface-2);border-radius:6px;
  padding:6px 9px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);
}
.user-chip{
  display:flex;align-items:center;gap:8px;padding-left:12px;margin-left:4px;border-left:1px solid var(--line);
}
.user-avatar{
  width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;
}
#content{padding:22px;max-width:1280px;width:100%;margin:0 auto;}

/* ---------- Common bits ---------- */
h1.page-title{font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:-.2px;}
p.page-sub{margin:0 0 20px;color:var(--muted);font-size:13px;}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.5px;}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
.kpi .sub.up{color:var(--critical);}
.kpi .sub.down{color:var(--good);}
.kpi-accent{position:absolute;left:0;top:0;bottom:0;width:3px;}

.panel-row{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:20px;}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);
}
.panel h3{margin:0 0 3px;font-size:13.5px;font-weight:600;}
.panel .panel-sub{font-size:11.5px;color:var(--muted);margin:0 0 14px;}

.bars{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:10px;}
.bar-row .name{font-size:12px;color:var(--ink-2);}
.bar-track{height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
.bar-fill{height:100%;border-radius:5px;}
.bar-row .amt{font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right;color:var(--ink-2);}

.status-list{display:flex;flex-direction:column;gap:9px;}
.status-list .srow{display:flex;align-items:center;gap:9px;font-size:12.5px;}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.status-list .srow .name{flex:1;color:var(--ink-2);}
.status-list .srow .count{font-family:"IBM Plex Mono",monospace;font-weight:600;}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.search{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  border-radius:7px;padding:7px 10px;flex:1;min-width:180px;max-width:320px;
}
.search input{border:none;outline:none;background:transparent;width:100%;font-size:13px;}
.search svg{color:var(--muted);flex:0 0 auto;}
select.filter{
  border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;font-size:13px;
}
.spacer{flex:1;}
.btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:7px 13px;font-size:13px;
  font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.btn:hover{border-color:var(--line-strong);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.danger{color:var(--critical);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.sm{padding:5px 9px;font-size:12px;}

/* table */
.table-wrap{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:640px;}
thead th{
  text-align:left;padding:10px 14px;font-size:11.3px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;font-weight:600;
  border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;
}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.rownum{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11.5px;}
.cell-strong{font-weight:600;}
.cell-muted{color:var(--muted);}
.cell-filelink{color:var(--accent,#2563eb);font-family:"IBM Plex Mono",monospace;font-size:11.5px;word-break:break-all;cursor:help;}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.icon-btn{
  border:1px solid transparent;background:transparent;border-radius:6px;padding:5px;cursor:pointer;color:var(--muted);
  display:inline-flex;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.empty-row td{text-align:center;padding:40px 14px;color:var(--muted);}

.file-dl{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;border:none;
  background:var(--accent-soft);color:var(--accent-dark);font-size:11.3px;font-weight:600;font-family:inherit;
  text-decoration:none;white-space:nowrap;max-width:100%;cursor:pointer;
}
.file-dl:hover{filter:brightness(0.95);}
.file-dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;}
.file-dl-list{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11.3px;font-weight:600;white-space:nowrap;
}
.badge svg{width:11px;height:11px;}
.badge.b-good{background:var(--good-soft);color:var(--good);}
.badge.b-warning{background:var(--warning-soft);color:var(--warning);}
.badge.b-serious{background:var(--serious-soft);color:var(--serious);}
.badge.b-critical{background:var(--critical-soft);color:var(--critical);}
.badge.b-neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);}
.badge.b-accent{background:var(--accent-soft);color:var(--accent-dark);}

.dday{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;}
.dday.close{color:var(--critical);}
.dday.near{color:var(--warning);}
.dday.far{color:var(--ink-2);}

.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(10,16,24,.42);display:flex;align-items:flex-start;
  justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;
}
.overlay[hidden]{display:none;}
.modal{
  background:var(--surface);border-radius:11px;width:100%;max-width:560px;box-shadow:var(--shadow);
  border:1px solid var(--line);
}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-head h2{margin:0;font-size:15px;font-weight:700;flex:1;}
.modal-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:13px;max-height:64vh;overflow-y:auto;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12px;font-weight:600;color:var(--ink-2);}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);font-size:13px;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
.field textarea{resize:vertical;min-height:60px;}
.field-hint{font-size:11px;color:var(--muted);margin-top:2px;}
.file-current{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;margin-bottom:8px;background:var(--surface-2);
}
.file-thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto;}
.file-meta{flex:1;min-width:0;}
.file-meta .fname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-meta .fsize{font-size:11px;color:var(--muted);}
.file-remove{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--critical);white-space:nowrap;font-weight:500;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);}

.ac-dropdown{
  position:fixed;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow);max-height:180px;overflow-y:auto;
}
.ac-item{padding:7px 10px;font-size:12.5px;color:var(--ink);cursor:pointer;}
.ac-item:hover{background:var(--surface-2);}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:12.5px;
  box-shadow:var(--shadow);z-index:200;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.confirm-overlay{
  position:fixed;inset:0;background:rgba(10,16,24,.42);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:300;
}
.confirm-box{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);
  width:100%;max-width:340px;padding:20px;
}
.confirm-box p{margin:0 0 16px;font-size:13.5px;color:var(--ink);line-height:1.5;}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px;}
.confirm-actions .btn.danger.primary{background:var(--critical);border-color:var(--critical);color:#fff;}
.confirm-actions .btn.danger.primary:hover{filter:brightness(.92);}

.tabbar{display:flex;align-items:flex-end;gap:22px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.tab-btn{
  background:transparent;border:none;border-bottom:2px solid transparent;
  padding:10px 2px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent);}
.tabbar-spacer{flex:1;}
.tabbar-year{display:flex;align-items:center;gap:7px;padding-bottom:8px;}
.tabbar-year label{font-size:11.5px;color:var(--muted);font-weight:600;}
.tabbar-year select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:12.5px;color:var(--ink);}

.status-section{margin-bottom:28px;}
.status-section-head h3{margin:0 0 2px;font-size:14px;font-weight:700;}
.status-section-head .panel-sub{margin:0 0 13px;color:var(--muted);font-size:12px;}

.upload-grid{display:grid;gap:12px;}
.month-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));}
.supplier-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}

.upload-slot{
  display:block;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface);
  cursor:pointer;overflow:hidden;
}
.upload-slot:hover{border-color:var(--accent);}
.upload-slot-body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 8px;min-height:92px;gap:6px;color:var(--muted);text-align:center;
}
.upload-slot-body.empty svg{opacity:.55;}
.upload-slot-hint{font-size:11px;}
.upload-slot-body.filled{padding:10px;gap:6px;position:relative;align-items:stretch;}
.upload-slot-body.filled img{width:100%;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
.doc-slot{border:1px dashed var(--line-strong);width:100%;font:inherit;color:inherit;padding:0;background:var(--surface);text-align:left;}
.upload-slot-body.filled .doc-slot-thumb{width:100%;height:68px;border-radius:6px;}
.upload-slot-file{width:100%;height:68px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:6px;color:var(--muted);}
.upload-slot-meta{width:100%;text-align:left;}
.upload-slot-meta .fname{font-size:11.3px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.upload-slot-meta .fsize{font-size:10.3px;color:var(--muted);}
.upload-slot-remove{
  position:absolute;top:6px;right:6px;background:rgba(15,26,38,.72);color:#fff;border:none;border-radius:6px;
  padding:4px;cursor:pointer;display:flex;
}
.upload-slot-remove:hover{background:var(--critical);}
.upload-slot-label{
  text-align:center;font-size:11.3px;font-weight:600;padding:7px 6px;
  border-top:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
}

.eval-list{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.eval-row{
  display:grid;grid-template-columns:100px 56px 1fr 20px;align-items:center;gap:14px;
  width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);
  padding:10px 14px;cursor:pointer;font:inherit;color:var(--ink);
}
.eval-row:last-child{border-bottom:none;}
.eval-row:hover{background:var(--surface-2);}
.eval-row-month{font-size:12.8px;font-weight:600;}
.eval-row-photo{width:56px;height:40px;display:flex;align-items:center;}
.eval-row-photo{position:relative;}
.eval-row-photo img,.eval-row-thumb{width:56px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
.file-thumb-generic{display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted);}
.eval-row-photo-count{
  position:absolute;bottom:-2px;right:-2px;background:var(--accent);color:var(--accent-ink);
  font-size:9.5px;font-weight:700;border-radius:8px;padding:1px 4px;line-height:1.3;
}
.eval-row-comment{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.eval-row-arrow{color:var(--muted);display:flex;}
.eval-editor-box{max-width:420px;}
@media(max-width:600px){.eval-row{grid-template-columns:80px 44px 1fr 16px;gap:8px;}}

.overdue-banner{
  border:1px solid var(--critical);background:var(--critical-soft);border-radius:10px;
  padding:14px 16px;margin-bottom:16px;
}
.overdue-head{display:flex;gap:10px;align-items:flex-start;color:var(--critical);}
.overdue-head b{font-size:13.5px;}
.overdue-head .sub{font-size:12px;color:var(--ink-2);font-weight:400;margin-top:3px;}
.overdue-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.overdue-row{
  display:grid;grid-template-columns:100px 1fr 1.4fr 60px auto;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;
}
.overdue-row a.btn{text-decoration:none;}
@media(max-width:760px){.overdue-row{grid-template-columns:1fr 1fr;grid-auto-rows:auto;}}

.section-note{
  display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-2);margin-bottom:16px;
}
.section-note svg{flex:0 0 auto;margin-top:1px;color:var(--muted);}

@media (max-width:900px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .panel-row{grid-template-columns:1fr;}
  .modal-body{grid-template-columns:1fr;}
}
@media (max-width:760px){
  #sidebar{position:fixed;left:0;transform:translateX(-100%);box-shadow:0 0 0 2000px rgba(0,0,0,0);}
  #sidebar.open{transform:translateX(0);box-shadow:12px 0 30px rgba(0,0,0,.25);}
  #menuToggle{display:inline-flex;}
  #content{padding:16px;}
  .kpi-row{grid-template-columns:1fr 1fr;}
  .user-chip .uname{display:none;}
}

var _capPromises = {};

var SEED = {
  claims: [],
  samples: [],
  suppliers: [],
  d8reports: [],
  audits: [],
  gauges: [],
  reliability: [],
  staff: [],
  supplierEval: {},
  esgDocs: {},

  riskMatrixDocs: {}
};

/* ============================= STATE / PERSIST =============================
   This app ships as a single self-contained HTML file meant to be saved onto
   a shared network folder — like a versioned "배포본" — and opened directly
   by teammates (no server, no external account needed).

   Each save via "팀 공유용 파일로 저장" bakes the current data into a fresh
   copy of this file with an incrementing version number (v1, v2, ...). When
   that file is opened (by anyone, on any PC), its embedded data is MERGED
   into whatever is already on that PC — matching records (same id) are
   overwritten by the file's version, but any records that exist ONLY on that
   PC (not yet shared) are kept, not discarded. So opening someone else's
   newer save never silently destroys local work in progress. The same merge
   also runs when you use "다른 사람의 파일 가져오기" to pull in a
   colleague's copy without replacing the page you're on. */
var STORE_KEY = 'stkr_qms_beta_v2';
var VER_KEY = STORE_KEY + '_distver';

/* ============================= IndexedDB DATA STORE =============================
   localStorage has a small per-origin quota (typically ~5-10MB) and this
   app's data -- especially attached files (base64 PDFs/images) -- can
   easily grow well past that. When that happens, localStorage.setItem
   throws QuotaExceededError on every save, and the old code silently swallowed
   it: nothing was actually saved from that point on, even though the UI kept
   showing a "저장되었습니다" success toast. IndexedDB has a much larger quota
   and is built for exactly this, so it is the actual data store now;
   localStorage is only used for the tiny VER_KEY version marker. */
var IDB_NAME = 'stkr_qms_idb';
var IDB_STORE = 'kv';
function idbOpenMain(){
  return new Promise(function(resolve, reject){
    if(typeof indexedDB === 'undefined'){ reject(new Error('indexedDB unavailable')); return; }
    var req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbGet(key){
  return idbOpenMain().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(IDB_STORE, 'readonly');
        var req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = function(){ resolve(req.result !== undefined ? req.result : null); };
        req.onerror = function(){ resolve(null); };
      }catch(e){ resolve(null); }
    });
  }).catch(function(){ return null; });
}
function idbSet(key, value){
  return idbOpenMain().then(function(db){
    return new Promise(function(resolve, reject){
      try{
        var tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error); };
      }catch(e){ reject(e); }
    });
  });
}

var EMBEDDED = null;
(function(){
  try{
    var el = document.getElementById('embeddedState');
    var txt = el ? el.textContent.trim() : '';
    if(txt){ EMBEDDED = JSON.parse(txt); }
  }catch(e){ EMBEDDED = null; }
})();

function blankState(){ return JSON.parse(JSON.stringify(SEED)); }
function normalizeState(s){
  Object.keys(SEED).forEach(function(k){
    if(Array.isArray(SEED[k])){ if(!Array.isArray(s[k])) s[k] = []; }
    else { if(!s[k] || typeof s[k]!=='object' || Array.isArray(s[k])) s[k] = {}; }
  });
  return s;
}
/* Still used by the manual "다른 사람의 파일 가져오기" backup/import path
   below: merges `incoming` into `base`, matching records by id or, for
   modules with an excelImport.matchKey, by that business key too. */
function moduleMatchKeyField(k){
  var mod = (typeof MODULES !== 'undefined') ? MODULES[k] : null;
  return (mod && mod.excelImport && mod.excelImport.matchKey) || null;
}
function mergeStateBundle(base, incoming){
  base = normalizeState(base || blankState());
  incoming = normalizeState(incoming || blankState());
  var added = 0, updated = 0;
  var out = {};
  Object.keys(SEED).forEach(function(k){
    if(Array.isArray(SEED[k])){
      var mkField = moduleMatchKeyField(k);
      var baseById = {}, baseByMatch = {};
      base[k].forEach(function(r){
        if(!r) return;
        if(r.id) baseById[r.id] = r;
        if(mkField && r[mkField]) baseByMatch[r[mkField]] = r;
      });
      var consumedBaseIds = {};
      var merged = incoming[k].map(function(r){
        if(!r) return r;
        var existing = (r.id && baseById[r.id]) || (mkField && r[mkField] && baseByMatch[r[mkField]]) || null;
        if(existing){
          if(existing.id) consumedBaseIds[existing.id] = true;
          updated++;
          if(existing.id && r.id !== existing.id){
            return Object.assign({}, r, { id: existing.id });
          }
          return r;
        }
        added++;
        return r;
      });
      base[k].forEach(function(r){
        if(r && r.id && !consumedBaseIds[r.id]){ merged.push(r); }
      });
      out[k] = merged;
    } else {
      var mk = Object.assign({}, base[k]);
      Object.keys(incoming[k]).forEach(function(key){
        if(mk[key]) updated++; else added++;
        mk[key] = incoming[k][key];
      });
      out[k] = mk;
    }
  });
  return { state: out, added: added, updated: updated };
}
var DIST_VER = 0;
try{ DIST_VER = parseInt(localStorage.getItem(VER_KEY), 10) || 0; }catch(e){ DIST_VER = 0; }

/* ============================= FIREBASE DATA STORE =============================
   This app now runs as a shared, logged-in web app instead of a single file
   passed around by hand: Cloud Firestore is the live, shared data store,
   and every logged-in teammate's browser keeps open real-time listeners,
   so an edit made by one person shows up for everyone else within a second
   or two, with no file to export/import.

   No Firebase Storage here (it now requires a billing-enabled "Blaze"
   project) -- attachments stay exactly as before, embedded as base64 data
   URLs, right inside the record. Firestore caps a single document at 1MB,
   so each array-type module (claims, samples, suppliers, d8reports,
   audits, gauges, reliability, staff) is stored as ONE FIRESTORE DOCUMENT
   PER RECORD (collection name = module key, doc id = record.id) instead
   of one big document holding the whole array -- that keeps every doc
   small regardless of how many records exist. The upload size limit was
   lowered to 600KB (see the 600*1024 checks) so a single attached file,
   base64-encoded, comfortably fits in a 1MB document alongside its other
   fields. The small keyed-map modules (supplierEval/esgDocs/certDocs/
   riskMatrixDocs) stay as one whole document each, as before. */
var FS_COLL = 'qms';
var ARRAY_KEYS = Object.keys(SEED).filter(function(k){ return Array.isArray(SEED[k]); });
var MAP_KEYS = Object.keys(SEED).filter(function(k){ return !Array.isArray(SEED[k]); });
var MAX_DOC_BYTES = 900000;
var state = blankState();
var currentUser = null;
var isGuest = false;
var fbListenersAttached = false;
var appStarted = false;

function showLoginOverlay(msg){
  var ov = document.getElementById('loginOverlay');
  var shell = document.getElementById('shell');
  if(ov) ov.style.display = 'flex';
  if(shell) shell.style.display = 'none';
  var errEl = document.getElementById('loginError');
  if(errEl) errEl.textContent = msg || '';
}
function hideLoginOverlay(){
  var ov = document.getElementById('loginOverlay');
  var shell = document.getElementById('shell');
  if(ov) ov.style.display = 'none';
  if(shell) shell.style.display = '';
}

/* Writes every module's current in-memory state to Firestore. Called after
   any add/edit/delete (same call sites as the old IndexedDB persist()).
   For array modules this diffs against what's currently in the collection
   so deleted records are actually removed there too, not just left behind. */
/* Queued explicit deletions: {col, id} pairs for records the user actually
   removed. persist() applies exactly these deletes -- it NEVER deletes a
   Firestore doc just because it's "missing" from the in-memory `state[k]`
   array. That diff-against-memory approach was tried first and turned out
   unsafe: if the local array was ever even briefly incomplete (a listener
   that hadn't caught up yet, a module whose records lack a stable `id`,
   two people saving near-simultaneously), the very next unrelated save
   would silently delete every record missing from that incomplete local
   copy. Explicit queued deletes avoid that class of bug entirely. */
var pendingDeletes = [];
function queueDelete(col, id){
  if(!id) return;
  pendingDeletes.push({ col: col, id: id });
}

/* How many persist() calls are currently in flight (Firestore writes are
   async and can take a moment). The "저장되었습니다" toast at each call
   site used to fire the instant the user clicked Save, BEFORE this async
   write actually reached Firestore -- so closing the tab/browser right
   after seeing that toast (which looks like confirmation) could silently
   drop the edit if the write hadn't gone out yet. pendingSaveCount drives
   a beforeunload warning so the browser itself blocks an early close. */
var pendingSaveCount = 0;
window.addEventListener('beforeunload', function(e){
  if(pendingSaveCount > 0){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

/* If a write to Firestore never comes back at all (most likely: a
   corporate network/firewall/proxy blocking outbound access to Google's
   Firestore servers), the promise from .set()/.delete()/.commit() can
   simply hang forever instead of failing -- which would leave
   pendingSaveCount stuck above 0 permanently (so the "unsaved changes"
   warning never goes away, even after closing and reopening) with no
   error ever shown. This wraps a Firestore call with a time limit so it
   always settles one way or another and tells the user plainly what's
   likely wrong instead of hanging silently. */
function withSaveTimeout(promise){
  return Promise.race([
    promise,
    new Promise(function(_, reject){
      setTimeout(function(){
        reject(new Error('네트워크 응답이 45초 이상 없습니다. 업로드 속도가 느리거나(핫스팟 등) 회사 네트워크/방화벽이 Firebase 접속을 막고 있는지 확인해주세요.'));
      }, 45000);
    })
  ]);
}

function persist(){
  if(isGuest){
    showToast('게스트 계정은 조회만 가능합니다. 수정하려면 품질팀 계정으로 로그인해주세요.');
    return Promise.resolve();
  }
  pendingSaveCount++;
  var batch = fbDb.batch();
  var oversizedNames = [];
  ARRAY_KEYS.forEach(function(k){
    (state[k] || []).forEach(function(r){
      if(!r || !r.id) return; // records without a stable id can't be safely upserted per-doc; see queueDelete note above
      var payload = Object.assign({}, r, {
        _updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        _updatedBy: (currentUser && currentUser.email) || ''
      });
      if(JSON.stringify(payload).length > MAX_DOC_BYTES){
        oversizedNames.push(r.title || r.desc || r.part || r.id);
        return; // skip this one record; don't fail the whole save
      }
      batch.set(fbDb.collection(k).doc(r.id), payload);
    });
  });
  MAP_KEYS.forEach(function(k){
    var payload = {
      map: state[k] || {},
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: (currentUser && currentUser.email) || ''
    };
    if(JSON.stringify(payload).length > MAX_DOC_BYTES){
      oversizedNames.push(k);
      return;
    }
    batch.set(fbDb.collection(FS_COLL).doc(k), payload);
  });
  var deletesToApply = pendingDeletes;
  pendingDeletes = [];
  deletesToApply.forEach(function(d){
    batch.delete(fbDb.collection(d.col).doc(d.id));
  });
  // batch.commit() alone is NOT proof the write reached Firestore's
  // servers -- with enablePersistence on, that promise resolves as soon as
  // the write lands in the LOCAL cache, even while genuinely offline (e.g.
  // a firewall silently blocking Firebase's connection). That looked like
  // a successful save here while the write never left this browser, so
  // nothing ever showed up for anyone else. waitForPendingWrites() only
  // resolves once the backend has actually acknowledged it; if the
  // connection really is blocked, this will hang until withSaveTimeout's
  // 45s limit trips and shows a real error instead of a false "saved".
  return withSaveTimeout(batch.commit().then(function(){ return fbDb.waitForPendingWrites(); })).then(function(){
    if(oversizedNames.length){
      showToast('용량이 너무 커서 저장되지 않은 항목이 있습니다 (600KB 이하 첨부파일을 사용해주세요): ' + oversizedNames.slice(0,3).join(', '));
    }
  }).catch(function(err){
    console.error(err);
    // Put the deletes back so they aren't silently lost on a failed save.
    pendingDeletes = deletesToApply.concat(pendingDeletes);
    showToast('저장 중 오류가 발생했습니다: ' + ((err && err.message) || ''));
  }).finally(function(){
    pendingSaveCount--;
  });
}

/* Targeted single-record save/delete -- used by the everyday paths (add,
   edit, delete one record) INSTEAD of the broad persist() above.

   Why: persist() re-upserts every record currently sitting in this
   browser's local `state[k]` arrays, for every array module, on every
   single save. That's fine when nothing else is happening, but with more
   than one person using the app at once it's a real clobber risk: if
   Tucson's local copy of (say) the gauges list is a few seconds out of
   date when a teammate adds a new gauge, the very next time Tucson edits
   something unrelated and persist() runs, it re-writes Tucson's slightly
   stale copy of EVERY gauge record over whatever is in Firestore right
   now -- silently overwriting the teammate's just-added gauge with
   nothing (it simply isn't in Tucson's stale local array). The data looks
   saved (the success toast fires) because Tucson's own edit did go
   through; the teammate's unrelated, concurrent edit is what quietly
   disappears. persistRecord/persistDelete touch only the one Firestore
   document the user actually changed, so they can never step on anyone
   else's unrelated record. persist() is kept for genuinely bulk actions
   (Excel import, merging in a shared file, initial seeding) where many
   records are meant to change in the same action. */
function persistRecord(modKey, record){
  if(isGuest){
    showToast('게스트 계정은 조회만 가능합니다. 수정하려면 품질팀 계정으로 로그인해주세요.');
    return Promise.resolve();
  }
  if(!record || !record.id) return Promise.resolve();
  var payload = Object.assign({}, record, {
    _updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    _updatedBy: (currentUser && currentUser.email) || ''
  });
  if(JSON.stringify(payload).length > MAX_DOC_BYTES){
    showToast('용량이 너무 커서 저장되지 않았습니다 (600KB 이하 첨부파일을 사용해주세요): ' + (record.title || record.desc || record.part || record.id));
    return Promise.resolve();
  }
  pendingSaveCount++;
  // See the note above persist()'s batch.commit() -- waitForPendingWrites()
  // is chained in so this promise only resolves once Firestore's servers
  // actually have the write, not just this browser's offline cache.
  return withSaveTimeout(fbDb.collection(modKey).doc(record.id).set(payload).then(function(){ return fbDb.waitForPendingWrites(); })).catch(function(err){
    console.error(err);
    showToast('저장 중 오류가 발생했습니다: ' + ((err && err.message) || ''));
  }).finally(function(){
    pendingSaveCount--;
  });
}
function persistDelete(modKey, id){
  if(isGuest){
    showToast('게스트 계정은 조회만 가능합니다. 수정하려면 품질팀 계정으로 로그인해주세요.');
    return Promise.resolve();
  }
  if(!id) return Promise.resolve();
  pendingSaveCount++;
  return withSaveTimeout(fbDb.collection(modKey).doc(id).delete().then(function(){ return fbDb.waitForPendingWrites(); })).catch(function(err){
    console.error(err);
    showToast('삭제 중 오류가 발생했습니다: ' + ((err && err.message) || ''));
  }).finally(function(){
    pendingSaveCount--;
  });
}

/* Full wipe ("전체 초기화"): the one place a whole collection is actually
   meant to be emptied, so it explicitly reads every doc id and deletes it
   -- this is deliberate and separate from persist()'s normal save path. */
function wipeAllFirestoreData(){
  return Promise.all(ARRAY_KEYS.map(function(k){
    return fbDb.collection(k).get().then(function(snap){
      var batch = fbDb.batch();
      snap.forEach(function(doc){ batch.delete(doc.ref); });
      return snap.size ? batch.commit() : null;
    });
  })).then(function(){
    var batch = fbDb.batch();
    MAP_KEYS.forEach(function(k){
      batch.set(fbDb.collection(FS_COLL).doc(k), { map: {}, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: (currentUser && currentUser.email) || '' });
    });
    return batch.commit();
  });
}

/* First login ever on a brand-new Firebase project: Firestore is empty, so
   seed it once from this file's embedded snapshot (the real data this file
   shipped with) instead of starting blank. Every login after that reads
   straight from Firestore and ignores the embedded snapshot, since it's
   frozen at whatever the data looked like when this file was generated. */
function seedFirestoreFromEmbeddedIfEmpty(){
  return fbDb.collection(ARRAY_KEYS[0]).limit(1).get().then(function(snap){
    if(!snap.empty) return false;
    return fbDb.collection(FS_COLL).limit(1).get().then(function(snap2){
      if(!snap2.empty) return false;
      state = (EMBEDDED && EMBEDDED.data) ? normalizeState(EMBEDDED.data) : blankState();
      return persist().then(function(){ return true; });
    });
  });
}

/* A record's Firestore doc id is always the source of truth for `.id` --
   this covers any record saved before an `id` field existed on it (e.g.
   staff rows added before this fix), without creating a second, duplicate
   doc for it the next time it's saved. */
function docToRecord(doc){
  var d = doc.data();
  if(!d.id) d.id = doc.id;
  return d;
}
function loadStateFromFirestoreOnce(){
  var arrayWork = Promise.all(ARRAY_KEYS.map(function(k){
    return fbDb.collection(k).get().then(function(snap){
      var rows = [];
      snap.forEach(function(doc){ rows.push(docToRecord(doc)); });
      state[k] = rows;
    });
  }));
  var mapWork = Promise.all(MAP_KEYS.map(function(k){
    return fbDb.collection(FS_COLL).doc(k).get().then(function(snap){
      if(!snap.exists) return;
      state[k] = snap.data().map || {};
    });
  }));
  return Promise.all([arrayWork, mapWork]).then(function(){ normalizeState(state); });
}

/* Real-time sync: once logged in, every module collection/document is
   watched, so a save from a teammate's browser lands here automatically
   and the screen re-renders -- no page refresh, no file import needed. */
function attachFirestoreListeners(){
  if(fbListenersAttached) return;
  fbListenersAttached = true;
  ARRAY_KEYS.forEach(function(k){
    fbDb.collection(k).onSnapshot(function(snap){
      var rows = [];
      snap.forEach(function(doc){ rows.push(docToRecord(doc)); });
      state[k] = rows;
      if(appStarted && typeof render === 'function'){ render(); }
    }, function(err){ console.error('listener error', k, err); });
  });
  MAP_KEYS.forEach(function(k){
    fbDb.collection(FS_COLL).doc(k).onSnapshot(function(snap){
      if(!snap.exists) return;
      state[k] = snap.data().map || {};
      if(appStarted && typeof render === 'function'){ render(); }
    }, function(err){ console.error('listener error', k, err); });
  });
}

var stateReadyResolve;
var stateReadyPromise = new Promise(function(res){ stateReadyResolve = res; });

/* Firebase keeps a login signed in indefinitely (it silently refreshes the
   token) unless something explicitly signs out -- so to make a login
   expire after 24 hours, we track our own login timestamp and sign out
   once it's past due, both right when auth state resolves and on a
   recurring timer for anyone who leaves the tab open past that point. */
var SESSION_MAX_MS = 24 * 60 * 60 * 1000;
var SESSION_TS_KEY = 'stkr_qms_login_ts';
function recordLoginTimestamp(){
  try{ localStorage.setItem(SESSION_TS_KEY, String(Date.now())); }catch(e){}
}
function clearLoginTimestamp(){
  try{ localStorage.removeItem(SESSION_TS_KEY); }catch(e){}
}
function isSessionExpired(){
  var ts;
  try{ ts = parseInt(localStorage.getItem(SESSION_TS_KEY), 10); }catch(e){ ts = NaN; }
  if(!ts || isNaN(ts)) return false; // no timestamp recorded (e.g. pre-existing session): treat as fresh, record one below
  return (Date.now() - ts) > SESSION_MAX_MS;
}
setInterval(function(){
  if(currentUser && isSessionExpired()){
    clearLoginTimestamp();
    fbAuth.signOut();
  }
}, 5 * 60 * 1000);

fbAuth.onAuthStateChanged(function(user){
  if(user){
    if(isSessionExpired()){
      clearLoginTimestamp();
      fbAuth.signOut();
      return;
    }
    if(!localStorage.getItem(SESSION_TS_KEY)){ recordLoginTimestamp(); }
    currentUser = user;
    isGuest = !!user.isAnonymous;
    document.body.classList.toggle('guest-mode', isGuest);
    hideLoginOverlay();
    var nameEl = document.getElementById('userName');
    var avEl = document.getElementById('userAvatar');
    if(nameEl) nameEl.textContent = isGuest ? '게스트' : user.email;
    if(avEl) avEl.textContent = isGuest ? 'GU' : (user.email || '?').slice(0,2).toUpperCase();
    var dataReady = isGuest
      ? loadStateFromFirestoreOnce()
      : seedFirestoreFromEmbeddedIfEmpty().then(function(seeded){
          if(seeded) return;
          return loadStateFromFirestoreOnce();
        });
    withSaveTimeout(dataReady).then(function(){
      attachFirestoreListeners();
      stateReadyResolve();
    }).catch(function(err){
      console.error(err);
      showToast('데이터를 불러오는 중 오류가 발생했습니다: ' + ((err && err.message) || '네트워크를 확인해주세요.'));
      stateReadyResolve();
    });
  } else {
    currentUser = null;
    isGuest = false;
    document.body.classList.remove('guest-mode');
    showLoginOverlay();
  }
});

document.addEventListener('DOMContentLoaded', function(){
  var form = document.getElementById('loginForm');
  var logoutBtn = document.getElementById('logoutBtn');
  if(form){
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var email = document.getElementById('loginEmail').value.trim();
      var pw = document.getElementById('loginPassword').value;
      var btn = document.getElementById('loginBtn');
      var loading = document.getElementById('loginLoading');
      document.getElementById('loginError').textContent = '';
      if(btn) btn.disabled = true;
      if(loading) loading.style.display = 'block';
      fbAuth.signInWithEmailAndPassword(email, pw).catch(function(err){
        var msg = '로그인에 실패했습니다.';
        if(err && (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-email')){
          msg = '이메일 또는 비밀번호가 올바르지 않습니다.';
        }
        document.getElementById('loginError').textContent = msg;
      }).finally(function(){
        if(btn) btn.disabled = false;
        if(loading) loading.style.display = 'none';
      });
    });
  }
  var guestBtn = document.getElementById('guestLoginBtn');
  if(guestBtn){
    guestBtn.addEventListener('click', function(){
      document.getElementById('loginError').textContent = '';
      guestBtn.disabled = true;
      fbAuth.signInAnonymously().catch(function(err){
        var msg = '게스트 로그인에 실패했습니다.';
        if(err && err.code === 'auth/operation-not-allowed'){
          msg = '게스트(익명) 로그인이 아직 꺼져있습니다. 관리자에게 문의해주세요.';
        }
        document.getElementById('loginError').textContent = msg;
      }).finally(function(){
        guestBtn.disabled = false;
      });
    });
  }
  var forgotBtn = document.getElementById('loginForgotBtn');
  if(forgotBtn){
    forgotBtn.addEventListener('click', function(){
      var errEl = document.getElementById('loginError');
      var infoEl = document.getElementById('loginInfo');
      errEl.textContent = '';
      infoEl.textContent = '';
      var email = document.getElementById('loginEmail').value.trim();
      if(!email){
        errEl.textContent = '먼저 이메일을 입력한 뒤 눌러주세요.';
        return;
      }
      forgotBtn.disabled = true;
      fbAuth.sendPasswordResetEmail(email).then(function(){
        infoEl.textContent = email + ' 주소로 비밀번호 재설정 메일을 보냈습니다. 메일함(스팸함 포함)을 확인해주세요.';
      }).catch(function(err){
        var msg = '재설정 메일 발송에 실패했습니다.';
        if(err && err.code === 'auth/invalid-email'){ msg = '이메일 형식이 올바르지 않습니다.'; }
        else if(err && err.code === 'auth/user-not-found'){ msg = '등록되지 않은 이메일입니다. 관리자(품질팀)에게 계정 등록을 요청해주세요.'; }
        errEl.textContent = msg;
      }).finally(function(){
        forgotBtn.disabled = false;
      });
    });
  }
  if(logoutBtn){
    logoutBtn.addEventListener('click', function(){
      clearLoginTimestamp();
      fbAuth.signOut();
    });
  }
});

/* Bake the current data into a full copy of this page and offer it for
   download, so it can be saved onto the shared folder for the team. */
function buildSnapshotHtml(nextVer){
  var savedAt = new Date().toISOString();
  var el = document.getElementById('embeddedState');
  var prevTxt = el ? el.textContent : '';
  // Escape "</" so no user-entered text (e.g. a note containing a closing
  // script tag) can prematurely end the embedded JSON block when re-parsed.
  var payload = JSON.stringify({ data: state, savedAt: savedAt, distVer: nextVer }).replace(/<\//g, '<\\/');
  if(el){ el.textContent = payload; }
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  if(el){ el.textContent = prevTxt; }
  return { html: html, savedAt: savedAt, distVer: nextVer };
}
function exportSnapshot(){
  var nextVer = DIST_VER + 1;
  var built = buildSnapshotHtml(nextVer);
  var stamp = built.savedAt.slice(0,10);
  var filename = 'STKR_QMS_v'+nextVer+'_'+stamp+'.html';
  var blob = new Blob([built.html], {type:'text/html'});
  function afterSave(){
    DIST_VER = nextVer;
    try{ localStorage.setItem(VER_KEY, String(DIST_VER)); }catch(e){}
  }
  getCap('downloads').then(function(downloads){
    if(downloads){
      downloads.save({filename: filename, data: blob}).then(function(){
        afterSave();
        showToast('v'+nextVer+' 저장 완료. 다운로드된 파일을 공유 폴더의 기존 파일과 교체해주세요.');
      }).catch(function(err){
        if(err && err.code==='declined') return;
        afterSave();
        downloadBlobFallback(blob, filename, nextVer);
      });
    } else {
      afterSave();
      downloadBlobFallback(blob, filename, nextVer);
    }
  });
}
function importMergeFile(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var text = e.target.result;
      var m = text.match(/<script[^>]*id=["']embeddedState["'][^>]*>([\s\S]*?)<\/script>/i);
      if(!m || !m[1] || !m[1].trim()){ showToast('이 파일에서 QMS 데이터를 찾지 못했습니다. STKR QMS에서 내보낸 파일인지 확인해주세요.'); return; }
      var bundle = JSON.parse(m[1].trim());
      if(!bundle || !bundle.data){ showToast('파일 형식을 인식하지 못했습니다.'); return; }
      var r = mergeStateBundle(state, bundle.data);
      state = r.state;
      if(bundle.distVer && bundle.distVer > DIST_VER){
        DIST_VER = bundle.distVer;
        try{ localStorage.setItem(VER_KEY, String(DIST_VER)); }catch(e2){}
      }
      persist();
      renderMenu();
      render();
      showToast('가져오기 완료 (v'+(bundle.distVer||'?')+'): 신규 '+r.added+'건 · 갱신 '+r.updated+'건');
    }catch(err){
      showToast('파일을 읽는 중 오류가 발생했습니다.');
    }
  };
  reader.onerror = function(){ showToast('파일을 읽는 중 오류가 발생했습니다.'); };
  reader.readAsText(file);
}
function downloadBlobFallback(blob, filename, ver){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  showToast((ver?('v'+ver+' '):'')+'파일이 다운로드되었습니다. 공유 폴더의 기존 파일과 교체해주세요.');
}

/* ============================= 원본 파일에 직접 저장 (File System Access API) =============================
   기본 방식("팀 공유용 파일로 저장")은 매번 새 파일을 "다운로드"만 할 뿐, 원래 열어둔
   .html 파일 자체는 절대 갱신되지 않는다 (브라우저가 로컬 파일을 직접 덮어쓸 수 없기 때문).
   그래서 사용자가 예전 원본 파일을 계속 다시 열면 항상 그 파일이 처음 만들어졌을 때의
   데이터만 보이고, 방금 입력한 내용은 "저장이 안 된 것처럼" 보인다.
   Chrome/Edge(PC)는 File System Access API로 사용자가 선택한 로컬 파일에 실제로
   쓰기(overwrite)가 가능하므로, 이를 이용해 "지금 연 그 파일 자체"에 바로 저장한다. */
var LOCAL_FILE_DB = 'stkr_qms_filehandle_db';
var LOCAL_FILE_STORE = 'handles';
var localFileHandle = null;
function fsAccessSupported(){ return typeof window.showOpenFilePicker === 'function'; }
function idbOpenHandleDb(){
  return new Promise(function(resolve, reject){
    if(typeof indexedDB === 'undefined'){ reject(new Error('no indexedDB')); return; }
    var req = indexedDB.open(LOCAL_FILE_DB, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(LOCAL_FILE_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbGetFileHandle(){
  return idbOpenHandleDb().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(LOCAL_FILE_STORE, 'readonly');
        var req = tx.objectStore(LOCAL_FILE_STORE).get('main');
        req.onsuccess = function(){ resolve(req.result || null); };
        req.onerror = function(){ resolve(null); };
      }catch(e){ resolve(null); }
    });
  }).catch(function(){ return null; });
}
function idbSetFileHandle(handle){
  return idbOpenHandleDb().then(function(db){
    return new Promise(function(resolve){
      try{
        var tx = db.transaction(LOCAL_FILE_STORE, 'readwrite');
        tx.objectStore(LOCAL_FILE_STORE).put(handle, 'main');
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  }).catch(function(){ return false; });
}
function connectLocalFile(){
  if(!fsAccessSupported()){ showToast('이 기능은 Chrome 또는 Edge(PC버전)에서만 사용할 수 있습니다.'); return; }
  window.showOpenFilePicker({
    types:[{description:'STKR QMS 파일', accept:{'text/html':['.html','.htm']}}],
    excludeAcceptAllOption:false, multiple:false
  }).then(function(handles){
    localFileHandle = handles[0];
    idbSetFileHandle(localFileHandle);
    showToast('파일이 연결되었습니다: '+localFileHandle.name+' — 이제 "지금 이 파일에 저장"을 누르면 그 파일에 바로 저장됩니다.');
    renderSettings();
  }).catch(function(){ /* 사용자가 선택 취소 */ });
}
function saveToLocalFile(){
  if(!localFileHandle){ showToast('먼저 파일을 선택해 연결해주세요.'); return; }
  Promise.resolve(localFileHandle.requestPermission ? localFileHandle.requestPermission({mode:'readwrite'}) : 'granted')
    .then(function(perm){
      if(perm!=='granted'){ showToast('파일 쓰기 권한이 없습니다. 다시 연결해주세요.'); return; }
      var nextVer = DIST_VER + 1;
      var built = buildSnapshotHtml(nextVer);
      return localFileHandle.createWritable().then(function(writable){
        return writable.write(built.html).then(function(){ return writable.close(); });
      }).then(function(){
        DIST_VER = nextVer;
        try{ localStorage.setItem(VER_KEY, String(DIST_VER)); }catch(e){}
        showToast('v'+nextVer+' 저장 완료 — '+localFileHandle.name+' 파일 자체가 갱신되었습니다.');
        renderSettings();
      });
    }).catch(function(err){
      showToast('파일 저장 중 오류가 발생했습니다: '+(err && err.message ? err.message : '알 수 없는 오류'));
    });
}
function restoreLocalFileHandle(){
  if(!fsAccessSupported()) return;
  idbGetFileHandle().then(function(handle){
    if(!handle) return;
    localFileHandle = handle;
    if(currentRoute()==='settings'){ renderSettings(); }
  });
}

/* ============================= CLAIMS REPORT (첨부파일 포함 다운로드) =============================
   Builds a single self-contained HTML report of every registered claim. Each
   claim's attachment (already stored as a base64 data URL) is embedded
   directly into the report file itself — an image shows as an inline
   thumbnail you can click to open full-size, any other file type (pdf, doc,
   xlsx, ...) becomes a clickable download link — so the report keeps working
   even when opened offline, with no separate attachment files to lose. */
function escHtml(s){
  var d = document.createElement('div');
  d.textContent = (s===null||s===undefined) ? '' : String(s);
  return d.innerHTML;
}
function buildClaimsReportHtml(){
  var rows = state.claims.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var stamp = todayISO();
  var rowsHtml = rows.map(function(r, i){
    var attHtml = '<span class="cm">-</span>';
    if(r.attachment && typeof r.attachment === 'string' && r.attachment.trim()){
      attHtml = '<span class="cm" style="word-break:break-all;">'+escHtml(r.attachment)+'</span>';
    }
    var owner = r.ownerName ? (escHtml(r.ownerName)+(r.ownerEmail?'<br><span class="cm">'+escHtml(r.ownerEmail)+'</span>':'')) : '-';
    return '<tr>'+
      '<td>'+(i+1)+'</td>'+
      '<td class="mono">'+escHtml(r.id)+'</td>'+
      '<td>'+escHtml(r.date)+'</td>'+
      '<td>'+escHtml(r.customer)+'</td>'+
      '<td>'+escHtml(r.model)+'</td>'+
      '<td>'+escHtml(r.part)+'</td>'+
      '<td>'+escHtml(r.symptomType)+'</td>'+
      '<td>'+escHtml(r.occurType)+'</td>'+
      '<td>'+escHtml(r.severity)+'</td>'+
      '<td>'+escHtml(r.status)+'</td>'+
      '<td>'+owner+'</td>'+
      '<td>'+escHtml(r.dueDate)+'</td>'+
      '<td class="desc">'+escHtml(r.desc)+'</td>'+
      '<td>'+attHtml+'</td>'+
    '</tr>';
  }).join('');
  return '<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">'+
    '<title>고객 클레임 현황 리포트 '+stamp+'</title>'+
    '<style>'+
      'body{font-family:"Malgun Gothic","Apple SD Gothic Neo",-apple-system,sans-serif;margin:24px;color:#1b2530;background:#fff;}'+
      'h1{font-size:19px;margin:0 0 4px;}'+
      '.sub{color:#5b6b7a;font-size:12.5px;margin:0 0 18px;}'+

function downloadBlobDirect(blob, filename, successMsg){
  getCap('downloads').then(function(downloads){
    if(downloads){
      downloads.save({filename: filename, data: blob}).then(function(){
        showToast(successMsg);
      }).catch(function(err){
        if(err && err.code==='declined') return;
        downloadGeneratedFileFallback(blob, filename, successMsg);
      });
    } else {
      downloadGeneratedFileFallback(blob, filename, successMsg);
    }
  });
}
function downloadGeneratedFile(html, filename, successMsg){
  downloadBlobDirect(new Blob([html], {type:'text/html'}), filename, successMsg);
}
function downloadGeneratedFileFallback(blob, filename, successMsg){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  showToast(successMsg);
}

}

function fmtDate(d){ return d ? d : '-'; }
function daysUntil(d){
  if(!d) return null;
  var today = new Date();
  today.setHours(0,0,0,0);
  var target = new Date(d+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function todayISO(){
  var t = new Date();
  return t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);
}
function ddayCell(d){
  var n = daysUntil(d);
  if(n===null) return '<span class="cell-muted">-</span>';
  var cls = n<0 ? 'close' : (n<=5 ? 'close' : (n<=14 ? 'near' : 'far'));
  var txt = n===0 ? 'D-DAY' : (n>0 ? ('D-'+n) : ('D+'+Math.abs(n)));
  return '<div>'+fmtDate(d)+'</div><div class="dday '+cls+'">'+txt+'</div>';
}

function excelSerialToISO(v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v === 'number'){
    var utcDays = Math.floor(v - 25569);
    var d0 = new Date(utcDays*86400*1000);
    var y0=d0.getUTCFullYear(), m0=('0'+(d0.getUTCMonth()+1)).slice(-2), d1=('0'+d0.getUTCDate()).slice(-2);
    return y0+'-'+m0+'-'+d1;
  }
  if(v instanceof Date){
    var y=v.getUTCFullYear(), m=('0'+(v.getUTCMonth()+1)).slice(-2), d=('0'+v.getUTCDate()).slice(-2);
    return y+'-'+m+'-'+d;
  }
  var str = String(v).trim();
  var m2 = str.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m2){ return m2[1]+'-'+('0'+m2[2]).slice(-2)+'-'+('0'+m2[3]).slice(-2); }
  return '';
}

      sheetName:'종합',
      headerRowIndex:2,
      matchKey:'srcKey',
      parseRow:function(row){
        function s(v){ return (v===null||v===undefined) ? '' : String(v).trim(); }
        function toISO(v){
          if(v===null||v===undefined||v==='') return '';
          if(typeof v === 'number'){
            var utcDays = Math.floor(v - 25569);
            var d0 = new Date(utcDays*86400*1000);
            return d0.getUTCFullYear()+'-'+('0'+(d0.getUTCMonth()+1)).slice(-2)+'-'+('0'+d0.getUTCDate()).slice(-2);
          }
          var str = String(v).trim();
          var m2 = str.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
          if(m2){ return m2[1]+'-'+('0'+m2[2]).slice(-2)+'-'+('0'+m2[3]).slice(-2); }
          return '';
        }
        var customer = s(row[1]);
        var year = s(row[2]);
        var month = s(row[3]);
        var stkrPart = s(row[6]);
        var customerPart = s(row[7]);
        var partName = s(row[8]);
        if(!stkrPart && !customerPart && !partName) return null;
        var inProgressMark = s(row[12]);
        var registeredMark = s(row[13]);
        var doneMark = s(row[14]);
        var status = '예정';
        var note = s(row[20]);
        if(doneMark==='완료'){ status = '완료'; }
        else if(doneMark){ status = '불필요'; if(!note){ note = doneMark; } }
        else if(registeredMark){ status = '전산등록'; }
        else if(inProgressMark){ status = '진행중'; }
        return {
          srcKey: customer+'|'+year+'|'+month+'|'+stkrPart+'|'+customerPart,
          customer: customer,
          year: year ? parseFloat(year) : '',
          month: month,
          model: s(row[4]),
          powerise: s(row[5]),
          stkrPart: stkrPart,
          customerPart: customerPart,
          partName: partName,
          customerContact: s(row[9]),
          planDate: toISO(row[10]),
          grouping: s(row[11]),
          status: status,
          sampleShipDate: toISO(row[15]),
          germanReportNo: s(row[16]),
          esTestSchedule: s(row[17]),
          lotNo: s(row[18]),
          msCompleteDate: toISO(row[19]),
          note: note
        };
      }
    },

      hint:'"계측기 관리대장" 시트 형식의 엑셀 파일을 업로드하면 장비번호 기준으로 자동 등록/업데이트됩니다.',
      sheetName:'계측기 관리대장',
      headerRowIndex:6,
      parseRow:function(row){
        function s(v){ return (v===null||v===undefined) ? '' : String(v).trim(); }
        function toISO(v){
          if(v===null||v===undefined||v==='') return '';
          if(typeof v === 'number'){
            var utcDays = Math.floor(v - 25569);
            var d0 = new Date(utcDays*86400*1000);
            var y0=d0.getUTCFullYear(), m0=('0'+(d0.getUTCMonth()+1)).slice(-2), d1=('0'+d0.getUTCDate()).slice(-2);
            return y0+'-'+m0+'-'+d1;
          }
          if(v instanceof Date){
            var y=v.getUTCFullYear(), m=('0'+(v.getUTCMonth()+1)).slice(-2), d=('0'+v.getUTCDate()).slice(-2);
            return y+'-'+m+'-'+d;
          }
          var str = String(v).trim();
          var m2 = str.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
          if(m2){ return m2[1]+'-'+('0'+m2[2]).slice(-2)+'-'+('0'+m2[3]).slice(-2); }
          return '';
        }
        function toMonths(v){
          var str = s(v).toLowerCase();
          if(!str) return '';
          var num = parseFloat(str);
          if(isNaN(num)) return '';
          if(str.indexOf('year')>-1) return Math.round(num*12);
          return Math.round(num);
        }
        var equipNo = s(row[1]);
        var name = s(row[2]);
        if(!equipNo && !name) return null;
        var value = s(row[3]);
        var tolerance = s(row[4]);
        var model = value ? (value+(tolerance?' ('+tolerance+')':'')) : tolerance;
        var judgeAccept = s(row[5]);
        var judgeUnaccept = s(row[6]);
        var notFound = s(row[13]);
        var readyForCal = s(row[14]);
        var status = '적합';
        if(notFound){ status = '폐기'; }
        else if(readyForCal){ status = '교정예정'; }
        else if(judgeUnaccept){ status = '부적합'; }
        else if(judgeAccept){ status = '적합'; }
        var remark = s(row[34]) || s(row[37]);
        return {
          equipNo: equipNo,
          name: name || equipNo,
          model: model,
          dept: s(row[18]),
          cycle: toMonths(row[8]),
          lastCal: toISO(row[9]),
          nextCal: toISO(row[10]),
          agency: s(row[22]),
          status: status,
          note: remark
        };
      }
    },
    mail:{
      dateField:'nextCal', nameField:'ownerName', emailField:'ownerEmail',
      overdueCheck: function(r){ return r.nextCal && r.status!=='폐기' && daysUntil(r.nextCal)<0; },
      dueSoonCheck: function(r){ var n=daysUntil(r.nextCal); return r.nextCal && r.status!=='폐기' && n!==null && n>=0 && n<=7; },
      overdueLabel: '차기검교정일',
      overdueSubject: function(r,n){ return '[게이지 검교정 알림] '+(r.name||r.id)+' 검교정일 초과 (D+'+n+')'; },
      overdueBody: function(r,n){
        return (r.ownerName||'담당자')+'님,\n\n담당하신 계측기의 차기검교정일이 초과되었습니다.\n\n'+
          '- 장비번호: '+(r.equipNo||'-')+'\n- 계측기명: '+(r.name||'-')+'\n- 차기검교정일: '+(r.nextCal||'-')+' (D+'+n+')'+'\n- 현재 상태: '+(r.status||'-')+'\n\n빠른 확인 부탁드립니다.';
      },
      dueSoonSubject: function(r,n){ return '[게이지 검교정 확인] '+(r.name||r.id)+' 검교정일 임박 (D-'+n+')'; },
      dueSoonBody: function(r,n){
        return (r.ownerName||'담당자')+'님,\n\n담당하신 계측기의 차기검교정일이 얼마 남지 않았습니다.\n\n'+
          '- 장비번호: '+(r.equipNo||'-')+'\n- 계측기명: '+(r.name||'-')+'\n- 차기검교정일: '+(r.nextCal||'-')+' (D-'+n+')'+'\n- 현재 상태: '+(r.status||'-')+'\n\n미리 확인 부탁드립니다.';
      },
      saveSubject: function(r,isNew){ return '[게이지 검교정 '+(isNew?'배정':'업데이트')+' 안내] '+(r.name||r.id); },
      saveBody: function(r,isNew){
        return (r.ownerName||'담당자')+'님,\n\n계측기 검교정 담당이 '+(isNew?'배정':'업데이트')+'되었습니다.\n\n'+
          '- 장비번호: '+(r.equipNo||'-')+'\n- 계측기명: '+(r.name||'-')+'\n- 차기검교정일: '+(r.nextCal||'-')+'\n- 현재 상태: '+(r.status||'-')+
          (r.note?('\n\n[비고]\n'+r.note):'')+'\n\n확인 부탁드립니다.';
      }
    }
  },
  audits: {

var listUIState = {}; // per module: {q, status}
function mailFieldName(mail, kind){
  if(kind==='date') return mail.dateField || 'dueDate';
  if(kind==='name') return mail.nameField || 'ownerName';
  return mail.emailField || 'ownerEmail';
}
function renderOverdueBanner(modKey, rows){
  var m = MODULES[modKey];
  var mail = m.mail;
  if(!mail) return '';
  var dateKey = mailFieldName(mail,'date'), nameKey = mailFieldName(mail,'name'), emailKey = mailFieldName(mail,'email');
  var overdue = rows.filter(mail.overdueCheck);
  var dueSoon = mail.dueSoonCheck ? rows.filter(mail.dueSoonCheck) : [];
  if(!overdue.length && !dueSoon.length) return '';
  function rowHtml(r, isOverdue){
    var n = Math.abs(daysUntil(r[dateKey]));
    var subjectFn = isOverdue ? mail.overdueSubject : mail.dueSoonSubject;
    var bodyFn = isOverdue ? mail.overdueBody : mail.dueSoonBody;
    var subject = encodeURIComponent(subjectFn(r,n));
    var body = encodeURIComponent(bodyFn(r,n));
    var mailHref = r[emailKey] ? ('mailto:'+r[emailKey]+'?subject='+subject+'&body='+body) : null;
    var label = r.part || r.name || r.equipNo || r.partName || r.title || '-';
    var html = '<div class="overdue-row">';
    html += '<span class="mono cell-strong">'+(r.id||'-')+'</span>';
    html += '<span>'+label+'</span>';
    html += '<span>'+(r[nameKey]||'담당자 미지정')+(r[emailKey]?' · '+r[emailKey]:'')+'</span>';
    html += '<span class="dday '+(isOverdue?'close':'near')+'">'+(isOverdue?('D+'+n):('D-'+n))+'</span>';
    html += mailHref ? '<a class="btn sm primary" href="'+mailHref+'">메일 발송</a>' : '<span class="cell-muted" style="font-size:11.5px;">이메일 미등록</span>';
    html += '</div>';
    return html;
  }
  var html = '<div class="overdue-banner">';
  if(overdue.length){
    html += '<div class="overdue-head">'+ICONS.defect+'<div><b>'+mail.overdueLabel+' 초과 '+overdue.length+'건</b>';
    html += '<div class="sub">담당자 이메일이 등록된 건은 아래 버튼으로 알림 메일 초안을 바로 열 수 있습니다. 이 앱은 자동으로 메일을 발송하지 않으며, 버튼을 누르면 담당자의 메일 클라이언트가 열립니다.</div></div></div>';
    html += '<div class="overdue-list">'+overdue.map(function(r){return rowHtml(r,true);}).join('')+'</div>';
  }
  if(dueSoon.length){
    html += '<div class="overdue-head"'+(overdue.length?' style="margin-top:14px;"':'')+'>'+ICONS.info+'<div><b>'+mail.overdueLabel+' 임박(7일 이내) '+dueSoon.length+'건</b>';
    html += '<div class="sub">기한이 곧 도래하는 건입니다. 아래 버튼으로 확인 메일 초안을 열 수 있습니다.</div></div></div>';
    html += '<div class="overdue-list">'+dueSoon.map(function(r){return rowHtml(r,false);}).join('')+'</div>';
  }
  html += '</div>';
  return html;
}

function filteredRowsFor(modKey){
  var m = MODULES[modKey];
  var ui = listUIState[modKey] || {q:'', status:'전체', year:'전체', extra:'전체'};
  var rows = state[modKey];
  return rows.filter(function(r){
    var matchQ = !ui.q || m.searchKeys.some(function(k){ return (r[k]||'').toString().toLowerCase().indexOf(ui.q.toLowerCase())>-1; });
    var matchS = ui.status==='전체' || r[m.statusField]===ui.status;
    var matchY = true;
    if(m.yearFilterField && ui.year && ui.year!=='전체'){
      var dv = r[m.yearFilterField];
      matchY = !!dv && String(dv).slice(0,4)===String(ui.year);
    }
    var matchE = true;
    if(m.extraFilterField && ui.extra && ui.extra!=='전체'){
      matchE = r[m.extraFilterField]===ui.extra;
    }
    return matchQ && matchS && matchY && matchE;
  });
}

   active), instead of opening each record one at a time. Shown next to the

   mail/reminder config (gauges, reliability, d8reports). */
function showBulkAssignModal(modKey){
  var m = MODULES[modKey];
  var mail = m.mail;
  if(!mail) return;
  var nameKey = mailFieldName(mail,'name'), emailKey = mailFieldName(mail,'email');
  var rows = filteredRowsFor(modKey);
  var wrap = document.createElement('div');
  wrap.className = 'confirm-overlay';
  wrap.innerHTML =
    '<div class="confirm-box" style="max-width:380px;">'+
    '<h3 style="margin:0 0 6px;font-size:14.5px;">담당자 일괄 지정</h3>'+
    '<p style="margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.5;">현재 목록에 표시된 <b>'+rows.length+'건</b>에 아래 담당자를 한 번에 지정합니다. 검색창이나 상태 필터로 대상을 좁힌 뒤 열면 그 범위에만 적용됩니다.</p>'+
    '<div class="field"><label>담당자명</label><input id="bulkAssignName" data-ac-source="staffNameList" autocomplete="off" placeholder="명부에서 선택하세요"></div>'+
    '<div class="field" style="margin-top:10px;"><label>담당자 이메일</label><input id="bulkAssignEmail" type="email" placeholder="name@stabilus.com"></div>'+
    '<div class="confirm-actions" style="margin-top:14px;"><button type="button" class="btn" id="bulkAssignCancel">취소</button><button type="button" class="btn primary" id="bulkAssignApply">'+rows.length+'건에 적용</button></div>'+
    '</div>';
  document.body.appendChild(wrap);
  function cleanup(){ if(wrap.parentNode){ wrap.parentNode.removeChild(wrap); } document.removeEventListener('keydown', onKey); }
  function onKey(e){ if(e.key==='Escape') cleanup(); }
  wrap.addEventListener('click', function(e){ if(e.target===wrap) cleanup(); });
  document.getElementById('bulkAssignCancel').addEventListener('click', cleanup);
  var nameEl = document.getElementById('bulkAssignName');
  var emailEl = document.getElementById('bulkAssignEmail');
  nameEl.addEventListener('input', function(){
    var match = state.staff.filter(function(s){return s.name===nameEl.value;})[0];
    if(match && match.email){ emailEl.value = match.email; }
  });
  document.getElementById('bulkAssignApply').addEventListener('click', function(){
    var nameVal = nameEl.value.trim();
    if(!nameVal){ showToast('담당자명을 입력해주세요.'); return; }
    var emailVal = emailEl.value.trim();
    if(!rows.length){ showToast('적용할 항목이 없습니다.'); cleanup(); return; }
    var ids = {};
    rows.forEach(function(r){ ids[r.id]=true; });
    state[modKey].forEach(function(r){
      if(ids[r.id]){ r[nameKey]=nameVal; if(emailVal){ r[emailKey]=emailVal; } }
    });
    persist();
    renderMenu();
    var wasCount = rows.length;
    cleanup();
    rerenderModule(modKey);
    showToast(wasCount+'건에 담당자가 지정되었습니다.');
  });
}

var listCtxModKey = null;
function renderList(modKey, containerId, hideHeader){
  containerId = containerId || 'content';
  listCtxModKey = modKey;
  var m = MODULES[modKey];
  if(!listUIState[modKey]) listUIState[modKey] = {q:'', status:'전체', year:'전체', extra:'전체'};
  var ui = listUIState[modKey];
  var rows = state[modKey];
  var filtered = filteredRowsFor(modKey);

  var html = '';
  if(!hideHeader){ html += '<h1 class="page-title">'+m.label+'</h1><p class="page-sub">'+m.sub+'</p>'; }

  if(m.mail){ html += renderOverdueBanner(modKey, rows); }

  html += '<div class="toolbar">';
  html += '<div class="search">'+ICONS.search+'<input type="text" id="listSearch" placeholder="검색 (부품, 담당자, 번호 등)" value="'+escAttr(ui.q)+'"></div>';
  html += '<select class="filter" id="listStatusFilter">';
  m.statusFilters.forEach(function(s){ html += '<option value="'+s+'"'+(s===ui.status?' selected':'')+'>'+s+'</option>'; });
  html += '</select>';
  if(m.yearFilterField){
    html += '<select class="filter" id="listYearFilter">';
    html += '<option value="전체"'+(ui.year==='전체'?' selected':'')+'>전체 연도</option>';
    for(var yf=2023; yf<=2032; yf++){ html += '<option value="'+yf+'"'+(String(ui.year)===String(yf)?' selected':'')+'>'+yf+'년</option>'; }
    html += '</select>';
  }
  if(m.extraFilterField){
    html += '<select class="filter" id="listExtraFilter">';
    (m.extraFilterOptions||['전체']).forEach(function(o){ html += '<option value="'+o+'"'+(ui.extra===o?' selected':'')+'>'+(o==='전체'?'전체 '+(m.extraFilterLabel||''):o)+'</option>'; });
    html += '</select>';
  }
  html += '<div class="spacer"></div>';
  if(m.excelImport){
    html += '<label class="btn" style="cursor:pointer;" title="'+escAttr(m.excelImport.hint||'')+'">'+ICONS.d8+'<span>'+escAttr(m.excelImport.label||'엑셀 업로드')+'</span><input type="file" accept=".xlsx,.xls" hidden data-excel-import-mod="'+modKey+'"></label>';
  }
  if(m.excelImport && m.mail){
    html += '<button type="button" class="btn" data-bulk-assign-mod="'+modKey+'" title="현재 목록에 표시된 항목에 담당자를 한 번에 지정합니다. 검색/상태 필터로 대상을 좁힐 수 있습니다.">'+ICONS.supplier+'<span>담당자 일괄 지정</span></button>';
  }
  if(modKey==='claims'){
    html += '<button type="button" class="btn" id="btnClaimsReport" title="현재 등록된 전체 클레임을 첨부파일이 포함된 리포트 파일로 내려받습니다.">'+ICONS.download+'<span>리포트 다운로드</span></button>';
  }
  html += '<button class="btn primary" id="btnAddRow">'+ICONS.plus+'<span>신규 등록</span></button>';
  html += '</div>';
  if(m.excelImport){
    html += '<div class="section-note">'+ICONS.info+'<div>'+escAttr(m.excelImport.hint||'')+'</div></div>';
  }

  html += '<div class="table-wrap"><div class="table-scroll"><table><thead><tr><th style="width:34px;">#</th>';
  m.columns.forEach(function(c){ html += '<th'+(c.align==='right'?' style="text-align:right;"':'')+'>'+c.label+'</th>'; });
  html += '<th style="text-align:right;">관리</th></tr></thead><tbody>';

  filtered.forEach(function(r, idx){
    html += '<tr data-id="'+r.id+'"><td class="rownum">'+(idx+1)+'</td>';
    m.columns.forEach(function(c){
      var content;
      if(c.render){ content = c.render(r); }
      else if(c.fmt){ content = c.fmt(r[c.key]); }
      else { content = (r[c.key]===undefined||r[c.key]==='') ? '<span class="cell-muted">-</span>' : r[c.key]; }
      html += '<td class="'+(c.cls||'')+'"'+(c.align==='right'?' style="text-align:right;"':'')+'>'+content+'</td>';
    });
    html += '<td><div class="row-actions">';
    html += '<button class="icon-btn" data-act="edit" data-id="'+r.id+'" title="수정">'+ICONS.edit+'</button>';
    html += '<button class="icon-btn" data-act="del" data-id="'+r.id+'" title="삭제">'+ICONS.trash+'</button>';
    html += '</div></td></tr>';
  });
  if(!filtered.length){
    html += '<tr class="empty-row"><td colspan="'+(m.columns.length+2)+'">조건에 맞는 데이터가 없습니다.</td></tr>';
  }
  html += '</tbody></table></div>';
  html += '<div class="pager"><span>전체 '+rows.length+'건 중 '+filtered.length+'건 표시</span><span class="mono">STKR QMS</span></div>';
  html += '</div>';

  document.getElementById(containerId).innerHTML = html;

  document.getElementById('listSearch').addEventListener('input', function(e){ ui.q = e.target.value; renderList(modKey, containerId, hideHeader); preserveFocus('listSearch'); });
  document.getElementById('listStatusFilter').addEventListener('change', function(e){ ui.status = e.target.value; renderList(modKey, containerId, hideHeader); });
  if(document.getElementById('listYearFilter')){
    document.getElementById('listYearFilter').addEventListener('change', function(e){ ui.year = e.target.value; renderList(modKey, containerId, hideHeader); });
  }
  if(document.getElementById('listExtraFilter')){
    document.getElementById('listExtraFilter').addEventListener('change', function(e){ ui.extra = e.target.value; renderList(modKey, containerId, hideHeader); });
  }
  document.getElementById('btnAddRow').addEventListener('click', function(){ openModal(modKey, null); });
  if(modKey==='claims' && document.getElementById('btnClaimsReport')){
    document.getElementById('btnClaimsReport').addEventListener('click', downloadClaimsReport);
  }
}
function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function preserveFocus(id){ var el=document.getElementById(id); if(el){ var v=el.value; el.focus(); el.value=v; el.selectionStart=el.selectionEnd=v.length; } }

/* Every upload slot below (Risk-Matrix / ESG / 인증서) now stores a plain
   text location string instead of an uploaded file -- clicking the slot
   opens a small text-entry editor (showDocEditor) rather than a native file
   picker, and the file itself stays on the company shared folder. */
function renderUploadSlot(kind, key, label){
  return renderDocCard(kind, key, label);
}

function renderDocCard(kind, key, label){
  var mapKey = STATUS_UPLOAD_MAPS[kind];
  var loc = state[mapKey][key];
  var hasLoc = loc && String(loc).trim();
  var html = '<button type="button" class="upload-slot doc-slot" data-doc-kind="'+kind+'" data-doc-key="'+escAttr(key)+'" data-doc-label="'+escAttr(label)+'">';
  if(hasLoc){
    html += '<div class="upload-slot-body filled">';
    html += '<div class="upload-slot-file">'+ICONS.d8+'</div>';
    html += '<div class="upload-slot-meta"><div class="fname" style="word-break:break-all;white-space:normal;">'+escAttr(String(loc))+'</div></div>';
    html += '</div>';
  } else {
    html += '<div class="upload-slot-body empty">'+ICONS.plus+'<div class="upload-slot-hint">클릭하여 위치 입력</div></div>';
  }
  html += '<div class="upload-slot-label">'+escAttr(label)+'</div>';
  html += '</button>';
  return html;
}

function showDocEditor(kind, key, label){
  var mapKey = STATUS_UPLOAD_MAPS[kind];

  var wrap = document.createElement('div');
  wrap.className = 'confirm-overlay';
  wrap.innerHTML =
    '<div class="confirm-box eval-editor-box">'+
    '<h3 style="margin:0 0 12px;font-size:14.5px;">'+escAttr(label)+'</h3>'+
    '<input type="text" id="docEditorLoc" value="'+escAttr(existingLoc?String(existingLoc):'')+'" placeholder="예: \\\\server\\share\\QMS\\첨부\\파일명.pdf" style="width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font:inherit;background:var(--surface);color:var(--ink);">'+
    '<div class="field-hint">관련 파일은 해당 주소를 사내 폴더에 붙여넣기 하여 확인하세요</div>'+
    '<div class="confirm-actions" style="margin-top:14px;"><button type="button" class="btn" id="docEditorCancel">취소</button><button type="button" class="btn primary" id="docEditorSave">저장</button></div>'+
    '</div>';
  document.body.appendChild(wrap);

  function cleanup(){ if(wrap.parentNode){ wrap.parentNode.removeChild(wrap); } document.removeEventListener('keydown', onKey); }
  function onKey(e){ if(e.key==='Escape') cleanup(); }
  wrap.addEventListener('click', function(e){ if(e.target===wrap) cleanup(); });

    cleanup();

    showToast('저장되었습니다.');

}

function renderEvalRow(key, label){
  var rec = state.supplierEval[key];
  var loc = rec && rec.location ? String(rec.location) : '';
  var hasComment = rec && rec.comment;
  var html = '<button type="button" class="eval-row" data-eval-key="'+escAttr(key)+'" data-eval-label="'+escAttr(label)+'">';
  html += '<span class="eval-row-month">'+escAttr(label)+'</span>';

    html += '<span class="eval-row-photo"><span class="cell-filelink" style="font-size:11.5px;" title="'+escAttr(loc)+'">'+escHtml(loc.length>18?loc.slice(0,18)+'…':loc)+'</span></span>';
  } else {
    html += '<span class="eval-row-photo"><span class="cell-muted" style="font-size:11.5px;">위치 없음</span></span>';
  }
  html += '<span class="eval-row-comment">'+(hasComment ? escAttrText(rec.comment) : '<span class="cell-muted">코멘트 없음</span>')+'</span>';

  html += '</button>';

function escAttrText(s){ var d=document.createElement('div'); d.textContent=String(s); var t=d.innerHTML; return t.length>60 ? t.slice(0,58)+'…' : t; }

  html += '<div class="status-section"><div class="status-section-head"><h3>Risk-Matrix</h3><p class="panel-sub">등급 B/C 협력사는 Risk-Matrix를 작성(첨부)해야 합니다. Audit 탭에서 등급이 등록된 협력사만 표시됩니다.</p></div>';

    html += '<p class="cell-muted" style="font-size:12px;">현재 등급 B/C 협력사가 없습니다.</p>';

function showConfirm(message, onYes){

}

function deleteRow(modKey, id){
  showConfirm('선택한 항목을 삭제하시겠습니까?', function(){

    rerenderModule(modKey);
  });

function rerenderModule(modKey){
  if(modKey==='suppliers'){ renderSupplierPage(); }
